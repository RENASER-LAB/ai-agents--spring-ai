spring:
  application:
    name: ai-engine

  config:
    import: optional:file:./application-secrets.yaml

  threads:
    virtual:
      enabled: true
  http:
    client:
      connect-timeout: 10s
      read-timeout: 90s

  datasource:
    url: jdbc:postgresql://localhost:5433/renaser_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema. Hibernate solo comprueba que las entidades
      # coincidan con lo que las migraciones crearon: si algo no cuadra, no arranca.
      ddl-auto: validate
    show-sql: true

  # El esquema vive en src/main/resources/db/migration, versionado. Nadie toca tablas a mano.
  flyway:
    enabled: true
    # La BD local ya tenía agent_run antes de adoptar Flyway en V1.
    # Flyway registra V1 como base y ejecuta V2 a V9 en el primer arranque.
    baseline-on-migrate: true
    baseline-version: 1

  # El CV pesa hasta 10 MB (regla del portal). El request completo un poco más, por el multipart.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  rabbitmq:
    # El broker de desarrollo, el del docker-compose. Para apuntar a otro —CloudAMQP, o el
    # que haya en produccion— se sobreescriben host, puerto, usuario, contrasena, vhost y
    # ssl en application-secrets.yaml, que no se versiona. Aqui nunca va una credencial de
    # verdad: este archivo esta en git.
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Cuántos candidatos se califican a la vez.
        #
        # Con el valor por defecto —uno— una tanda de diez currículums tarda lo que suman
        # las veinte llamadas al modelo, una detrás de otra: unos trece minutos. En paralelo
        # tarda lo que tarda el candidato más lento, que es alrededor de un minuto.
        #
        # No hace falta pensar en hilos del sistema: son hilos virtuales, y el trabajo es
        # esperar a una API, no calcular. El techo real lo pone el proveedor con su límite
        # de peticiones por minuto; si empiezan a salir errores 429, se baja este número.
        concurrency: 8
        max-concurrency: 12
        # Uno por consumidor: cada trabajo tarda medio minuto y repartirlos de a montones
        # deja a unos consumidores con cola y a otros de brazos cruzados.
        prefetch: 1
  ai:
    model:
      chat: deepseek
      embedding:
        text: google-genai

    deepseek:
      # ⚠️ La clave de verdad NO está aquí: está en application-secrets.yaml, que se importa
      # arriba (spring.config.import) y que no se versiona. Lo importado gana sobre este
      # archivo, así que este valor solo se usa si ese archivo no existe, y entonces cae en
      # la variable de entorno DEEPSEEK_API_KEY o, si tampoco está, en vacío.
      #
      # Vacío no da un error claro: da un 401 del proveedor a la primera calificación. Por
      # eso CalificacionIaRealIT comprueba que la clave se resuelva antes de nada — si un día
      # alguien cambia el orden de precedencia sin querer, salta ahí y no en producción.
      api-key: "${DEEPSEEK_API_KEY:}"
      chat:
        options:
          model: ${renaser.ai.chat.default-model}
          max-tokens: ${renaser.ai.chat.max-tokens}

    # Embeddings en la nube (Gemini Developer API, autenticado con API key, no Vertex).
    # gemini-embedding-2 normaliza solo los vectores truncados a menos de 3072 dimensiones;
    # gemini-embedding-001 (el modelo anterior) exige normalizarlos a mano.
    google:
      genai:
        embedding:
          api-key: ${google.gemini.api-key}
          text:
            model: gemini-embedding-2
            dimensions: 1536
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true
server:
  port: 8080
renaser:
  ai:
    chat:
      default-model: deepseek-v4-flash
      # El de la primera pasada. Contesta sin razonar: 19 segundos por currículum en vez de
      # 48, porque se ahorra los ~5.000 tokens de pensamiento interno que el otro gasta
      # antes de escribir. A cambio ordena distinto el medio de la tabla y ve menos riesgos,
      # así que sirve para ordenar la tanda, no para decidir a quién se contrata.
      modelo-rapido: deepseek-chat
      # 4096 truncaba el envelope: V4 Pro razona y esos tokens cuentan como salida.
      max-tokens: 16384
      max-intentos: 3
    # Los tres agentes que califican una postulación del hito 2 de selección
    calificacion:
      # Apagarla deja la postulación en PERFIL_CALIFICANDO sin encolar nada. Se usa en las
      # pruebas que no quieren tocar el modelo, y sirve de freno si el proveedor está caído.
      habilitada: true
      # Cuántas veces se reintenta un trabajo antes de darlo por fallido. Fallido NO significa
      # nota cero: significa que la postulación se queda esperando y hay que mirarla.
      max-intentos: 3
      # A partir de cuántos minutos un trabajo se considera colgado y se vuelve a encolar
      minutos-colgado: 15
      periodo-sondeo-ms: 300000

  # ¿Sale el correo de esta máquina, o solo se anota?
  #
  # «log» —el valor por defecto— guarda el aviso en `correo_enviado` y no manda nada. Es lo
  # que estaba antes y lo que tienen que seguir viendo los tests y quien arranque sin
  # credenciales: un descuido aquí le escribe a un candidato de verdad.
  #
  # «smtp» manda. Para encenderlo hacen falta, en application-secrets.yaml:
  #     spring.mail.host, .port, .username, .password
  #     renaser.correo.remitente
  #
  # ⚠️ Con Gmail la contraseña NO es la de la cuenta: desde 2022 hay que crear una
  # «contraseña de aplicación» con la verificación en dos pasos activada. La normal
  # devuelve 535 «Username and Password not accepted» y el error no explica por qué.
  #
  # En Render NO existe application-secrets.yaml —el Dockerfile no lo copia—, así que allí
  # esto llega por variable de entorno: CORREO_TRANSPORTE, CORREO_REMITENTE, y las de Spring
  # con su nombre en mayúsculas (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
  # SPRING_MAIL_PASSWORD). Van en la tabla de docs/CI-CD.md.
  # La direccion del portal del candidato, la que se le pega en el correo.
  #
  # Se configura y no se adivina porque no es la misma en cada sitio: en la maquina de un
  # desarrollador es el Vite local del puerto 5174, y publicado es Vercel. Una plantilla de
  # correo con la direccion escrita a mano acabaria mandando candidatos a localhost.
  #
  # ⚠️ Ese portal necesita una pantalla en /acceso que lea el token de la URL, llame a
  # POST /api/v1/portal/auth/acceso y guarde la sesion. Sin ella el enlace cae en la pagina
  # de vacantes sin iniciar sesion. Vive en el repositorio RenaserOsPostulantes.
  portal:
    url: ${PORTAL_URL:https://renaser-os-postulantes.vercel.app}

  correo:
    transporte: ${CORREO_TRANSPORTE:log}
    # La dirección que ve el candidato. Puede no ser la misma que autentica: con un dominio
    # propio se autentica una cuenta de servicio y se escribe desde no-responder@.
    remitente: ${CORREO_REMITENTE:}
    nombre-remitente: ${CORREO_NOMBRE_REMITENTE:Renaser}

supabase:
  url: https://ikyjurujfxpazygwloja.supabase.co
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# Configuración propia del módulo de reclutamiento
app:
  archivos:
    # Dónde viven los currículums. Hoy solo hay un sitio: el bucket.
    #
    # Hubo un almacén de disco y se quitó. Guardar el archivo en la máquina que atendió la
    # subida funciona con una sola: en cuanto corren dos copias del backend, la mitad de las
    # descargas contesta «no existe», y un despliegue que reemplaza el contenedor se lleva
    # los currículums por delante. Además obligaba a construir una ruta de fichero con un
    # dato que viene de la base, que es un patrón que ningún análisis de seguridad perdona.
    #
    # Las pruebas usan «memoria», que vive en el código de pruebas y no escribe en ningún
    # sitio. Ningún entorno de verdad tiene esa opción.
    tipo: ${ARCHIVOS_TIPO:supabase}
    #
    # La url y el nombre del bucket SÍ pueden vivir aquí: no son secretos. La url del
    # proyecto aparece en cualquier frontend que hable con Supabase, y el nombre del bucket
    # no abre nada por sí solo. Lo que no puede estar aquí es la clave: es la service_role,
    # se salta todas las reglas de acceso, y quien la tenga lee el bucket entero. Esa vive
    # en application-secrets.yaml, que no se versiona.
    supabase:
      # El proyecto de la base de datos del backend, NO el de los agentes de IA.
      url: ${SUPABASE_URL:https://jcmjaiwwnbbhflguydnq.supabase.co}
      bucket: ${ARCHIVOS_BUCKET:Documentos-cv}
      # Lo que dura un enlace de descarga. Corto a propósito: el enlace no vuelve a
      # preguntar quién eres, así que es tan secreto como el currículum que abre.
      minutos-enlace: 5
  seguridad:
    # Clave HMAC para firmar los tokens. Va en application-secrets.yaml (no se versiona)
    # o por variable de entorno. Mínimo 32 bytes; sin ella la aplicación no arranca.
    jwt-secreto: ${JWT_SECRETO:}
    # Cuánto vive un token de candidato y uno del equipo (en minutos)
    minutos-token-candidato: 120
    minutos-token-equipo: 480
