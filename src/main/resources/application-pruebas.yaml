# El entorno de Pruebas: la aplicación en una máquina EC2 de AWS detrás de Caddy, la base
# en Supabase y la cola en Amazon MQ. Se activa con SPRING_PROFILES_ACTIVE=pruebas, y quien
# lo hace es despliegue/docker-compose.yml. Nadie lo arranca a mano en su máquina.
#
# Hasta agosto de 2026 esto corría en Render, y por eso puede quedar alguna referencia
# suelta por ahí. La tubería y el servidor de verdad están descritos en docs/CI-CD.md.
#
# Aquí solo está lo que cambia respecto del desarrollo local. Los valores sensibles llegan
# por variables de entorno del .env del servidor (la lista completa está en docs/CI-CD.md);
# los que no tienen valor por defecto son obligatorios a propósito: si faltan, la
# aplicación no arranca y lo dice, en vez de arrancar apuntando a localhost.

server:
  # Caddy habla con el contenedor por el 8080 y no pasa ningún PORT, así que en la práctica
  # manda el valor por defecto. La variable se respeta por si algún día vuelve a mandarlo
  # quien hospede la aplicación.
  port: ${PORT:8080}

spring:
  datasource:
    # La cadena DIRECTA de Supabase (puerto 5432), no la del pooler (6543): el pooler
    # en modo transacción no mantiene la sesión y rompe las migraciones de Flyway.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    # Supabase no corta por carga: corta por número de conexiones abiertas, y el proyecto
    # tiene 30 para todo el equipo. Lo que no se reparta aquí lo reparte quien llegue
    # primero, así que el reparto se escribe.
    hikari:
      # El aviso de Hikari empieza por el nombre del pool. Con el de fábrica
      # («HikariPool-1») el registro del servidor no dice si el que se quedó sin conexiones
      # es este backend o cualquier otra cosa que arranque al lado.
      pool-name: renaser-pruebas
      # Doce de las treinta, contando UNA instancia de la aplicación. Las otras dieciocho
      # son para las personas: psql, el panel de Supabase, la rama de otro.
      #
      # Doce no es poco para los ~50 del portal. Una consulta del portal dura milisegundos
      # y devuelve la conexión enseguida, así que la misma conexión atiende a mucha gente
      # seguida. Lo que agota un pool no es cuánta gente hay, sino el trabajo lento que
      # retiene conexiones — y ese se limita más abajo, en los consumidores.
      maximum-pool-size: 12
      # El suelo. No se iguala al máximo —que es lo que recomienda Hikari cuando la base es
      # tuya— justamente porque no lo es: de madrugada no tiene sentido reservar doce
      # conexiones del cupo compartido para no usarlas. Con el mínimo por debajo del
      # máximo, Hikari suelta las que sobran tras diez minutos quietas (su idle-timeout de
      # fábrica) y vuelven al equipo. Cuatro y no cero para que la primera visita de la
      # mañana no pague el abrir: contra Supabase, con TLS, abrir cuesta cientos de ms.
      minimum-idle: 4
      # Diez segundos esperando un hueco, no los treinta de fábrica. Si el pool está lleno
      # es que algo va mal, y esperar treinta no lo arregla: solo apila peticiones y deja
      # al candidato mirando una pantalla que no dice ni que sí ni que no. A los diez falla,
      # el registro lo cuenta con el nombre del pool, y quien esté delante puede reintentar.
      connection-timeout: 10000
      # Quince minutos y a renovar, aunque la conexión parezca sana. La base ya no está en
      # esta máquina: Supabase —y cualquier cortafuegos de AWS por el camino— cierra
      # conexiones por su lado sin avisar, y la aplicación se entera al usarlas. El síntoma
      # es el peor de todos: un fallo intermitente que solo aparece tras un rato de calma.
      # Reciclarlas antes de que las cierre el otro extremo es lo que lo evita.
      max-lifetime: 900000
      # Cada cinco minutos Hikari toca las que están dormidas. Sin ese saludo, un NAT de
      # AWS da por muerta una conexión callada y la corta en silencio; con él, la que ya no
      # sirve se descubre dentro del pool y no en mitad de la petición de un candidato.
      # Tiene que ser menor que max-lifetime, o Hikari lo desactiva sin más.
      keepalive-time: 300000

  flyway:
    # El `true` global existe por la historia de la base LOCAL: agent_run ya existía
    # antes de adoptar Flyway. Aquí sería peligroso: si el esquema no está vacío —la
    # extensión vector ya deja rastro—, Flyway marcaría V1 como punto de partida SIN
    # ejecutarla, agent_run no se crearía y la aplicación no arrancaría (ddl-auto:
    # validate). Tras el primer despliegue se comprueba en flyway_schema_history que
    # la V1 aparezca ejecutada, no como baseline.
    baseline-on-migrate: false

  jpa:
    # Imprimir cada SQL es ruido, y en un entorno remoto además se paga
    show-sql: false

  rabbitmq:
    # Amazon MQ va con TLS por el 5671, no el 5672 plano del compose local: solo habla
    # AMQPS. El host va sin «amqps://» y sin puerto — Spring arma la url él solo.
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # El vhost del broker. En Amazon MQ es «/» salvo que se haya creado otro.
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true
    listener:
      simple:
        # Los ocho del archivo base salen de una base local que regala conexiones. Aquí no
        # las regala nadie. Calificar a un candidato son varias idas y venidas a la base
        # repartidas entre llamadas al modelo que duran decenas de segundos, y ocho o doce
        # consumidores compitiendo por las mismas doce conexiones dejan esperando al
        # portal por un trabajo de fondo que a nadie le corre prisa.
        #
        # Con cuatro de techo, los consumidores nunca pueden pedir más de un tercio del
        # pool y al portal le quedan ocho pase lo que pase. Calificar una tanda tarda el
        # doble; postularse sigue tardando lo mismo. Ese es el cambio que se acepta.
        #
        # ⚠️ Hoy el servidor NO usa estos dos números: despliegue/docker-compose.yml los
        # pisa con SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY (8 por defecto), porque
        # arreglado el N+1 de la bandeja el razonamiento de arriba ya no se sostiene y a
        # 2/4 la criba iba a un quinto de su ritmo. Estos quedan como suelo prudente.
        concurrency: 2
        max-concurrency: 4
