# El pipeline de cada cambio. Tres trabajos:
#
#   build    compila, corre los tests unitarios y los de integración (Testcontainers),
#            y manda la cobertura a SonarCloud, que vigila el código NUEVO del PR.
#   estatico Semgrep (patrones prohibidos, reglas en .semgrep/) y Gitleaks (secretos).
#   desplegar solo cuando main cambia y los otros dos quedaron en verde: construye la
#            imagen, la sube a ECR y le dice a la maquina de EC2 que se actualice. Sin
#            ninguna clave de AWS guardada: se usa OIDC.
#
# La prueba que llama a DeepSeek de verdad (CalificacionIaRealIT) NO corre aquí: se
# apaga sola si no existe la variable RENASER_IA_REAL. Ver docs/CI-CD.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si llega un push nuevo al mismo PR, la corrida vieja ya no le importa a nadie
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: compilar y probar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: SonarCloud la necesita para saber qué líneas son nuevas
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = unitarios (surefire) + integración (failsafe, Testcontainers usa el
      # Docker que el runner ya trae) + reporte de cobertura de JaCoCo
      - name: Compilar y correr todos los tests
        run: ./mvnw -B verify

      # Solo si el secreto existe: en un PR desde un fork no está, y no debe fallar por eso
      - name: Cobertura del código nuevo (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./mvnw -B sonar:sonar

      # La lista de lo que el sistema garantiza, en castellano y navegable. Se genera
      # también cuando algo falla —ahí es cuando más sirve, porque señala qué regla
      # dejó de cumplirse— y se descarga desde la pestaña Summary de la corrida.
      - name: Reporte legible de las pruebas
        if: always()
        run: python3 scripts/reporte-pruebas.py

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: target/reporte-pruebas.html
          retention-days: 30

  estatico:
    name: análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks revisa la historia, no solo el estado actual
          fetch-depth: 0

      - name: Semgrep (patrones prohibidos del proyecto)
        run: |
          pip install semgrep
          semgrep scan --error --config p/java --config .semgrep/

      # Se usa la imagen oficial y no la action `gitleaks/gitleaks-action`: esa exige
      # una licencia de pago cuando el repositorio pertenece a una organización, y
      # RENASER-LAB lo es. El programa en sí es MIT y gratis para cualquiera; lo que
      # se licencia es el envoltorio.
      #
      # --redact es obligatorio aquí: sin él, un secreto encontrado se imprimiría
      # entero en un registro público, que es peor que no haberlo buscado.
      - name: Gitleaks (secretos filtrados)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose

  desplegar:
    name: desplegar a AWS
    needs: [build, estatico]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Lo que hace posible que aquí no haya ninguna clave de AWS guardada. GitHub firma un
    # token de un solo uso, AWS lo verifica y devuelve credenciales que caducan en minutos.
    # Una clave de acceso guardada como secreto no caduca nunca: si se filtra, sigue valiendo.
    permissions:
      id-token: write
      contents: read

    env:
      REGION: us-east-1
      REGISTRO: 526338061654.dkr.ecr.us-east-1.amazonaws.com
      REPOSITORIO: ai-engine
      INSTANCIA: i-05fc037e853d07264
      URL: https://18-204-177-210.nip.io

    steps:
      - uses: actions/checkout@v4

      # Fijada por SHA y no por «@v4», que es una etiqueta y se puede mover. Esta accion
      # es la que pide las credenciales de AWS: si alguien se hiciera con el repositorio de
      # la accion y reapuntara la etiqueta, ese codigo correria aqui con permiso para subir
      # imagenes y lanzar comandos en el servidor. El SHA no se puede reapuntar.
      #
      # El SHA es el de v4 (7474bc4). Para subir de version: mirar el commit de la etiqueta
      # nueva con «gh api repos/aws-actions/configure-aws-credentials/git/ref/tags/vN» y
      # cambiar los dos, el hash y el comentario.
      - name: Pedirle permiso a AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::526338061654:role/github-despliegue
          aws-region: us-east-1

      - name: Entrar al registro
        run: aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRO"

      # Dos etiquetas a propósito. «latest» es la que despliega, y el SHA del commit es la
      # que permite volver atrás: sin ella, «la versión anterior» no tiene nombre y para
      # revertir hay que reconstruir desde el código.
      - name: Construir y subir la imagen
        run: |
          docker build             -t "$REGISTRO/$REPOSITORIO:${{ github.sha }}"             -t "$REGISTRO/$REPOSITORIO:latest" .
          docker push "$REGISTRO/$REPOSITORIO:${{ github.sha }}"
          docker push "$REGISTRO/$REPOSITORIO:latest"

      # Por SSM y no por SSH: no hay ninguna llave que guardar ni rotar, y el puerto 22 de la
      # máquina está cerrado. El servidor baja la imagen con su propio rol.
      - name: Desplegar en la máquina
        run: |
          ID=$(aws ssm send-command --region "$REGION"             --instance-ids "$INSTANCIA"             --document-name AWS-RunShellScript             --comment "despliegue ${{ github.sha }}"             --parameters 'commands=["cd /opt/renaser && ./desplegar.sh"]'             --query "Command.CommandId" --output text)
          echo "comando $ID"

          for i in $(seq 1 60); do
            ESTADO=$(aws ssm get-command-invocation --region "$REGION"               --command-id "$ID" --instance-id "$INSTANCIA"               --query Status --output text 2>/dev/null || echo Pending)
            case "$ESTADO" in
              Success) echo "Desplegado."; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "El despliegue falló ($ESTADO). Salida de la máquina:" >&2
                aws ssm get-command-invocation --region "$REGION" --command-id "$ID"                   --instance-id "$INSTANCIA" --query StandardErrorContent --output text >&2
                aws ssm get-command-invocation --region "$REGION" --command-id "$ID"                   --instance-id "$INSTANCIA" --query StandardOutputContent --output text >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "El despliegue no terminó en 10 minutos." >&2
          exit 1

      # El paso anterior ya comprueba desde dentro que la aplicación contesta. Este comprueba
      # lo que le importa a quien la usa: que se llega desde internet y con el certificado bien.
      - name: Comprobar desde fuera
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "$URL/api/v1/portal/vacantes"; then
              echo "Contesta por HTTPS desde internet."
              exit 0
            fi
            echo "Intento $i/30..."
            sleep 10
          done
          echo "No contestó desde fuera." >&2
          exit 1
