# La corrida nocturna: lo lento y lo exploratorio, que no puede bloquear un PR.
#
#   fuzzing  Schemathesis lee el contrato OpenAPI y bombardea con entradas raras todos los
#            endpoints que salgan en él —cuántos son no se escribe aquí: el contrato se
#            genera del código y el número caduca con el primer endpoint nuevo—. Cualquier
#            500 es un bug: la API debe contestar 4xx a la
#            basura. Corre contra una aplicación LOCAL del runner, nunca contra el servidor:
#            la calificación con IA va apagada y las claves son de mentira, así que
#            ningún currículum falso llega a DeepSeek ni ensucia la base de pruebas.
#   pit      Mutation testing: mete fallos a propósito en los cuatro paquetes de reglas
#            y comprueba que algún test se ponga rojo. Lo que mide no es cuánto código
#            pisan los tests, sino cuánto protegen. El reporte queda como artefacto.
#
# Si algo sale rojo aquí, no se bloquea nada: alguien lo mira por la mañana.
name: nocturno

on:
  schedule:
    # 05:00 UTC = medianoche en Perú/Ecuador/Colombia
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fuzzing:
    name: fuzzing de la API (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Claves de mentira: la aplicación arranca, pero si algo intentara llamar al
      # proveedor de verdad, recibiría un 401 y quedaría registrado como fallo.
      JWT_SECRETO: clave-solo-para-fuzzing-suficientemente-larga-para-hmac-256
      DEEPSEEK_API_KEY: clave-de-mentira-el-fuzzing-no-califica
      # Apaga la calificación con IA: postular no encola ningún trabajo
      RENASER_AI_CALIFICACION_HABILITADA: 'false'
      # El perfil «local» —el que se aplica aquí, porque nadie nombra otro— mueve el puerto
      # al 8081, que en una máquina de trabajo evita el 8080 ya ocupado. En el runner el 8080
      # está libre, y es el que dan por hecho las tres URL de abajo y el valor por defecto de
      # sembrar-datos-de-prueba.py. Se fija aquí para no repetir el número en cuatro sitios.
      SERVER_PORT: '8080'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Levantar Postgres y RabbitMQ
        run: docker compose up -d --wait

      # Es «test-run» y no «run» a propósito, por lo mismo que lo es en el README. El perfil
      # «local» pide app.archivos.tipo=memoria, y ese almacén es un doble que vive en
      # src/test: en producción no puede existir un almacén que se traga los currículums en
      # silencio. «run» solo carga el classpath de main, donde la única implementación de
      # AlmacenArchivos es la de Supabase y está condicionada a tipo=supabase, así que no
      # quedaba ningún bean que inyectar y la aplicación no arrancaba —«Parameter 16 of
      # constructor in ServicioAdministracionImpl required a bean of type AlmacenArchivos»—.
      # «test-run» arranca la misma aplicación con el classpath de pruebas, que sí lo trae.
      - name: Arrancar la aplicación
        run: |
          nohup ./mvnw -B spring-boot:test-run > app.log 2>&1 &
          for i in $(seq 1 36); do
            if curl --fail --silent --output /dev/null http://localhost:8080/v3/api-docs; then
              echo "La aplicación contesta."
              exit 0
            fi
            sleep 5
          done
          echo "La aplicación no arrancó en 3 minutos:" >&2
          tail -50 app.log >&2
          exit 1

      - name: Sembrar datos de prueba
        run: |
          pip install requests
          python3 scripts/sembrar-datos-de-prueba.py --uid fuzzer-nocturno

      - name: Fuzzear todos los endpoints
        run: |
          pip install 'schemathesis>=4,<5'
          TOKEN=$(curl --fail --silent -X POST http://localhost:8080/api/v1/panel/auth/dev-login \
            -H 'Content-Type: application/json' \
            -d '{"usuarioRenaserOsId":"fuzzer-nocturno"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          schemathesis run http://localhost:8080/v3/api-docs \
            --header "Authorization: Bearer $TOKEN"

      # El registro de la aplicación es lo único que explica un 500: se guarda siempre
      - name: Guardar el registro de la aplicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-aplicacion
          path: app.log
          retention-days: 7

  pit:
    name: mutation testing (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Correr PIT sobre los paquetes de reglas
        run: ./mvnw -B -Ppit test-compile pitest:mutationCoverage

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pit
          path: target/pit-reports/
          retention-days: 30
