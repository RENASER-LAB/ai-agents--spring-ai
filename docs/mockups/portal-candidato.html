<script>
(() => {

  ];
  const initial={theme:'light',registered:false,name:'Camila Torres',email:'camila@ejemplo.pe',evaluationIndex:0,evaluationAnswer:'',challengeStart:null,changeStart:null,challengeDelivered:false,simulationDate:'',applications:[

    {id:'app-dir',job:'dir-ops',stage:5,state:'NO_CONTINUA',days:0}
  ]};
  const clone=x=>JSON.parse(JSON.stringify(x));const load=()=>{try{return Object.assign(clone(initial),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(initial)}};let state=load();
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const stages=['CV','Evaluación','Prueba','Simulación','Validación'];
  const questions=[
    {type:'choice',text:'Un entregable importante se retrasará por un bloqueo externo. ¿Qué haces primero?',options:['Espero a tener una solución completa antes de avisar.','Aviso el riesgo, explico el impacto y propongo una siguiente acción.','Trabajo más rápido sin involucrar a nadie.','Cambio el plazo sin comunicarlo.']},
    {type:'text',text:'Cuéntanos una situación real en la que detectaste un riesgo antes de que afectara un resultado.',placeholder:'Describe el contexto, qué hiciste, qué resultado obtuviste y qué aprendiste.'},
    {type:'choice',text:'Tu equipo repite un error que ya fue corregido. ¿Cómo respondes?',options:['Corrijo personalmente cada entrega.','Aclaro el estándar, verifico la causa y establezco un control que evite repetirlo.','Espero a que el equipo lo resuelva solo.','Reasigno el trabajo sin explicar el motivo.']}
  ];
  function parse(){const parts=(location.hash||'#jobs').slice(1).split('/');render(parts[0]||'jobs',parts.slice(1))}
  function render(route,args){document.documentElement.dataset.theme=state.theme;$('#themeBtn').textContent=state.theme==='light'?'◐':'☀';$('#accountBtn').textContent=state.registered?state.name.split(' ')[0]:'Ingresar';const views={jobs:jobsView,job:jobView,register:registerView,apply:applyView,dashboard:dashboardView,evaluation:evaluationView,challenge:challengeView,simulation:simulationView,status:statusView};$('#view').innerHTML=(views[route]||jobsView)(...args);bind(route,args);window.scrollTo(0,0)}
  function jobsView(){return `<section class="hero"><div><h1>Encuentra tu próxima oportunidad en Renaser.</h1><p>Buscamos personas que conviertan problemas en resultados. Aquí podrás conocer cada vacante y demostrar cómo trabajas, más allá de tu CV.</p></div><aside class="hero-card"><b>Qué puedes esperar del proceso</b><ol><li><span>Postulas con tu CV y evidencia de trabajo.</span></li><li><span>Respondes una evaluación y una prueba del puesto.</span></li><li><span>Siempre ves tu etapa y tu siguiente acción.</span></li></ol></aside></section><div class="sectionhead"><div><h2>Vacantes abiertas</h2><p>Elige una oportunidad para conocer el proceso y postular.</p></div><span class="tag info">${jobs.length} oportunidades</span></div><div class="grid g3">${jobs.map(jobCard).join('')}</div>`}
  function jobCard(j){return `<article class="card job action" data-job="${j.id}"><div class="row"><span class="tag info">${j.level}</span><span class="small">${j.place}</span></div><h2>${j.title}</h2><p>${j.summary}</p><div class="job-footer"><span class="small">Proceso de 5 etapas</span><button class="link">Ver vacante</button></div></article>`}
  function jobView(id){const j=job(id);return `<button class="back" data-route="jobs">← Volver a vacantes</button><div class="pagehead"><div><div class="eyebrow">${j.level} · ${j.place}</div><h1>${j.title}</h1><p>${j.summary}</p></div></div><div class="detail-layout"><article class="detail"><div class="card"><h2 style="margin-top:0">El resultado que esperamos</h2><p>Queremos que la persona organice el trabajo, haga visibles los riesgos y entregue resultados verificables. Valoramos la iniciativa, el aprendizaje y la calidad de la evidencia.</p><h2>Lo que necesitamos</h2><ul><li>Experiencia demostrable resolviendo problemas del puesto.</li><li>Capacidad para explicar decisiones, supuestos y aprendizajes.</li><li>Comunicación preventiva cuando aparece un riesgo.</li><li>Disponibilidad para una simulación presencial de dos horas.</li></ul><h2>Cómo evaluamos</h2><p>Una inteligencia artificial participa en algunas calificaciones y explica su criterio. Las decisiones sensibles pueden ser revisadas por una persona.</p></div></article><aside class="sticky"><div class="card"><div class="label">Proceso de selección</div><div class="stage-list" style="margin-top:14px">${[['CV','Sube tu CV y enlaces'],['Evaluación','Responde '+j.questions+' preguntas'],['Prueba','Demuestra el trabajo en '+j.duration+' minutos'],['Simulación','Trabaja en una sesión grupal'],['Validación','Evidencia durante siete días']].map((s,i)=>`<div class="stage"><div class="stage-num">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}</div><button class="btn primary large" data-apply="${j.id}" style="width:100%;margin-top:18px">Postular</button></div></aside></div>`}
  function registerView(id){const j=job(id);return `<button class="back" data-route="job/${j.id}">← Volver a la vacante</button><div class="pagehead"><div><div class="eyebrow">Crear cuenta</div><h1>Empieza tu postulación.</h1><p>Tu cuenta te permitirá guardar avances y consultar el estado de todas tus postulaciones.</p></div></div><div class="card form-card"><div class="formgrid"><div class="field"><label>Nombre y apellidos</label><input id="regName" value="${state.name}"></div><div class="field"><label>Correo</label><input id="regEmail" type="email" value="${state.email}"></div><div class="field"><label>Contraseña</label><input id="regPass" type="password" value="Demo12345!"><div class="hint">Usa al menos 8 caracteres.</div></div><div class="field"><label>Repite la contraseña</label><input id="regPass2" type="password" value="Demo12345!"></div><div class="field full"><div class="consent"><input id="consent" type="checkbox"><div><b>Acepto el tratamiento de mis datos personales</b><p>Mis datos se usarán para evaluar esta postulación. Entiendo que una inteligencia artificial participa en la evaluación y que mis datos pueden almacenarse fuera del Perú.</p><button class="link" type="button" id="privacyLink">Leer política completa</button></div></div><div class="error" id="registerError">Completa los campos y acepta el tratamiento de datos para continuar.</div></div></div><div class="row" style="margin-top:20px"><span class="small">Postulas a ${j.title}</span><button class="btn primary large" id="createAccount">Crear cuenta y continuar</button></div></div>`}
  function applyView(id){const j=job(id);return `<button class="back" data-route="job/${j.id}">← Volver a la vacante</button><div class="pagehead"><div><div class="eyebrow">Postulación · ${j.level}</div><h1>${j.title}</h1><p>Comparte tu experiencia y evidencia. Podrás revisar esta información antes de enviarla.</p></div></div><div class="card form-card"><div class="upload"><input id="cvFile" type="file" accept=".pdf,.doc,.docx"><b id="fileName">Sube tu CV</b><span>PDF o Word · máximo 10 MB</span><button class="btn" id="chooseFile">Seleccionar archivo</button></div><div class="formgrid" style="margin-top:18px"><div class="field full"><label>Portafolio o sitio personal</label><input id="portfolio" placeholder="https://"></div><div class="field"><label>LinkedIn</label><input placeholder="https://linkedin.com/in/..."></div><div class="field"><label>GitHub u otro proyecto</label><input placeholder="https://"></div><div class="field full"><label>Resultado del que te sientas orgulloso</label><textarea id="achievement" placeholder="Cuéntanos qué cambió gracias a tu trabajo y cómo lo comprobaste."></textarea></div><div class="field full"><div class="error" id="applyError">Selecciona un CV y describe al menos un resultado para enviar tu postulación.</div></div></div><div class="row"><span class="small">Podrás retirar tu postulación desde tu panel.</span><button class="btn primary large" id="submitApplication">Enviar postulación</button></div></div>`}
  function dashboardView(){if(!state.registered)return loginRequired();const next=state.applications.find(a=>a.stage>0&&a.stage<5),j=next?job(next.job):null,action=next?actionFor(next):null;return `<div class="pagehead"><div><span class="greeting">Hola, ${esc(state.name.split(' ')[0])}</span><h1>Mis procesos</h1><p>Revisa primero lo que necesitas hacer y luego el avance de todas tus postulaciones.</p></div><button class="btn" data-route="jobs">Ver más vacantes</button></div>${next?`<section class="next-step-panel"><div><h2>${action.title}</h2><p>${action.help} Esta acción corresponde a tu postulación para ${j.title}.</p><div class="next-step-meta"><span>${stages[Math.min(next.stage,4)]}</span><span>·</span><span>${next.days===0?'Actualizado hoy':next.days+' días sin cambios'}</span></div></div><button class="btn large" data-app-action="${next.id}">${action.label}</button></section>`:''}<div class="sectionhead"><div><h2>Todos tus procesos</h2><p>Tu etapa actual y el historial de cada postulación.</p></div></div><div class="process-list">${state.applications.map(applicationCard).join('')}</div><section class="privacy-panel"><div class="sectionhead" style="margin-top:0"><div><h2>Privacidad y control</h2><p>Puedes retirar una postulación o solicitar la eliminación de tus datos.</p></div></div><div class="card"><div class="row"><div><b style="font-size:12px">Gestionar mis datos</b><p class="small" style="margin:5px 0 0">Consulta el consentimiento y administra tus solicitudes.</p></div><button class="btn" id="privacyManage">Abrir opciones</button></div></div></section>`}
  function applicationCard(a){const j=job(a.job),current=Math.min(a.stage,4),final=a.stage>=5;const action=actionFor(a);return `<article class="card process-card"><div class="application"><div><div class="row" style="justify-content:flex-start"><span class="tag ${final?'info':a.days>3?'warn':'good'}">${final?'Proceso finalizado':a.state.includes('CURSO')?'En curso':'Pendiente'}</span><span class="small">${j.level}</span></div><h2 style="margin-top:13px">${j.title}</h2><p>${final?'Este proceso terminó.':`Estás en ${stages[current]} · ${a.days===0?'actualizado hoy':a.days+' días sin cambios'}`}</p></div><button class="btn ${final?'':'primary'}" data-app-action="${a.id}">${action.label}</button></div><div class="steps">${stages.map((_,i)=>`<span class="step ${i<current?'done':i===current&&!final?'current':''}"></span>`).join('')}</div><div class="step-labels">${stages.map(s=>`<span>${s}</span>`).join('')}</div><div class="next-action"><div><b>${action.title}</b><span>${action.help}</span></div><button class="link" data-status="${a.id}">Ver detalle</button></div></article>`}
  function actionFor(a){if(a.stage===1)return{label:'Continuar evaluación',title:'Tienes una evaluación pendiente',help:'Tus respuestas se guardan automáticamente.'};if(a.stage===2)return{label:'Abrir prueba',title:'Prueba del puesto habilitada',help:'El cronómetro empezará cuando confirmes.'};if(a.stage===3)return{label:'Elegir fecha',title:'Confirma tu simulación',help:'Hay dos fechas disponibles.'};if(a.stage===4)return{label:'Ver estado',title:'Validación en curso',help:'El responsable del área registrará las métricas.'};return{label:'Ver resultado',title:'Proceso finalizado',help:'Tu información puede considerarse para futuras convocatorias, si vuelves a postular.'}}
  function evaluationView(appId){if(!state.registered)return loginRequired();const a=app(appId),j=job(a.job),q=questions[state.evaluationIndex%questions.length],shown=47+state.evaluationIndex,total=j.questions,percent=Math.min(98,shown/total*100);return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="exam-shell"><div class="exam-top"><div style="flex:1"><div class="row"><span class="progress-meta">Pregunta ${shown} de ${total}</span><span class="progress-meta">${Math.round(percent)}% completado</span></div><div class="progress"><i style="width:${percent}%"></i></div></div><div class="save-state"><i></i><span id="saveText">Respuesta guardada</span></div></div><article class="card"><div class="label">Evaluación Integral · ${j.level}</div><h1 class="question">${q.text}</h1>${q.type==='choice'?q.options.map((o,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${state.evaluationAnswer==i?'checked':''}><span>${o}</span></label>`).join(''):`<div class="field"><label>Tu respuesta</label><textarea id="textAnswer" placeholder="${q.placeholder}">${esc(state.evaluationAnswer)}</textarea></div>`}<div class="error" id="questionError">Responde esta pregunta para continuar.</div><div class="exam-foot"><div class="small"><b>No puedes regresar a preguntas anteriores.</b><br>Cada respuesta se guarda al continuar.</div><button class="btn primary large" id="nextQuestion">Guardar y continuar</button></div></article><div class="callout" style="margin-top:14px"><b>Si se corta tu conexión</b><p>Podrás volver a entrar y continuar desde la última respuesta guardada.</p></div></div>`}
  function challengeView(appId){if(!state.registered)return loginRequired();const a=app(appId),j=job(a.job),active=!!state.challengeStart;return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="pagehead"><div><div class="eyebrow">Prueba del puesto · ${j.level}</div><h1>${j.title}</h1><p>${active?'El cronómetro está corriendo y no se detiene al cerrar esta página.':'Lee todo antes de empezar. El tiempo comenzará únicamente cuando confirmes.'}</p></div></div><div class="desktop-warning callout warn"><b>Recomendamos usar una computadora</b><p>La prueba requiere consultar instrucciones y cargar entregables.</p></div>${active?activeChallenge(a,j):challengeIntro(a,j)}`}
  function challengeIntro(a,j){return `<div class="detail-layout"><article class="card detail"><h2 style="margin-top:0">El reto</h2><p>Diseña una solución que permita registrar bloqueos operativos, priorizarlos y asegurar que cada uno tenga responsable y próxima acción.</p><h2>Tu entrega</h2><ul><li>Una propuesta funcional o visual.</li><li>Una explicación breve de tus decisiones.</li><li>Evidencia de las verificaciones realizadas.</li></ul><div class="callout warn"><b>Cambio inesperado</b><p>Aparecerá al minuto ${j.changeAt}. Desde ese momento tendrás ${j.extra} minutos adicionales para adaptar tu solución.</p></div></article><aside class="timer-card"><div class="timer-label">Duración total</div><div class="timer">${String(j.duration).padStart(2,'0')}:00</div><p>Una vez iniciada, la prueba no puede pausarse. Si el tiempo termina, se entregará lo que hayas guardado.</p><button class="btn large" id="startChallenge" style="width:100%;margin-top:20px">Empezar prueba</button></aside></div>`}
  function activeChallenge(a,j){return `<div class="challenge-layout"><article><div class="card detail"><div class="label">Instrucciones</div><h2 style="margin-top:12px">Construye y explica tu solución</h2><p>Registra bloqueos con impacto, responsable, plazo y próxima acción. Prioriza lo que pueda detener un resultado.</p><div id="changeArea">${state.changeStart?unexpectedHtml(j):''}</div><div class="sectionhead"><div><h2>Entregable</h2><p>Puedes subir archivos o pegar enlaces.</p></div></div><div class="formgrid"><div class="field full"><label>Enlace a Figma, GitHub o Drive</label><input id="deliverableLink" value="https://figma.com/file/demostracion"></div><div class="field full"><label>Archivo</label><input type="file"></div><div class="field full"><label>¿Qué parte hiciste con IA y qué verificaste tú?</label><textarea id="aiUse">Usé IA para explorar alternativas. Verifiqué el flujo, los estados y los casos límite antes de entregar.</textarea></div></div><div class="row" style="margin-top:18px"><span class="small">Usar IA está permitido. Evaluamos si entiendes y verificas tu trabajo.</span><button class="btn primary" id="finishChallenge">Entregar prueba</button></div></div></article><aside><div class="timer-card"><div class="timer-label">Tiempo real restante</div><div class="timer" id="mainTimer">--:--:--</div><p>Este es el cronómetro que determina tu entrega y continúa aunque cierres la página.</p></div>${!state.changeStart?'<div class="demo-control"><span>Control de presentación</span><button class="link" id="triggerChange">Simular cambio</button></div>':''}</aside></div>`}
  function unexpectedHtml(j){return `<div class="unexpected"><div class="label warn">Cambio inesperado</div><h3>Ahora cada responsable puede tener un máximo de cinco bloqueos activos.</h3><p>Adapta tu propuesta sin perder la información registrada. Explica qué decisión tomaste y por qué.</p><div class="small">Tiempo adicional para responder al cambio</div><div class="change-timer" id="changeTimer">00:${String(j.extra).padStart(2,'0')}:00</div></div>`}
  function simulationView(appId){if(!state.registered)return loginRequired();const a=app(appId),j=job(a.job);if(!state.simulationDate)return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="pagehead"><div><div class="eyebrow">Simulación de 2 horas</div><h1>Elige una fecha.</h1><p>La sesión es grupal y presencial. Trabajarás en tu propia pantalla dentro del sistema.</p></div></div><div class="card form-card"><div class="stack"><label class="date-option"><input type="radio" name="date" value="22 de agosto · 09:00"><b>Viernes 22 de agosto · 09:00</b><span>Sala principal · Renaser Consulting · 6 de 8 cupos ocupados</span></label><label class="date-option"><input type="radio" name="date" value="24 de agosto · 15:00"><b>Domingo 24 de agosto · 15:00</b><span>Sala principal · Renaser Consulting · 3 de 8 cupos ocupados</span></label></div><div class="error" id="dateError">Selecciona una fecha para confirmar tu asistencia.</div><div class="row" style="margin-top:20px"><span class="small">Recibirás un correo con la confirmación, no con las preguntas.</span><button class="btn primary large" id="confirmDate">Confirmar asistencia</button></div></div>`;return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="pagehead"><div><div class="eyebrow">Simulación confirmada</div><h1>${state.simulationDate}</h1><p>Sala principal · Renaser Consulting. Llega 15 minutos antes.</p></div><span class="tag good">Asistencia confirmada</span></div><div class="sectionhead"><div><h2>Así se desarrollará la sesión</h2><p>Cada momento tiene una duración definida.</p></div></div><div class="phase-grid">${[['Contexto','10 min'],['Preguntas','10 min'],['Ejecución','65 min'],['Cambio','20 min'],['Entrega','10 min'],['Conversación','5 min']].map((p,i)=>`<div class="phase ${i===0?'current':''}"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="label">Qué debes llevar</div><p class="small">Documento de identidad, computadora con cargador y acceso a tus herramientas habituales.</p></div><div class="card"><div class="label">Durante la sesión</div><p class="small">Podrás preguntar, producir evidencia, adaptarte a un cambio y conversar con una persona al final.</p></div></div><div class="demo-control"><span>Control de presentación</span><button class="link" id="simulateValidation">Simular avance a validación</button></div>`}
  function statusView(appId){if(!state.registered)return loginRequired();const a=app(appId),j=job(a.job);if(a.state==='CERRADA')return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="card center-card"><div class="status-icon">×</div><div class="eyebrow">Postulación retirada</div><h1>Esta postulación está cerrada.</h1><p>Retiraste tu postulación a <b>${j.title}</b> y ya no recibirás avisos de esta vacante. Retirarte no elimina tus datos; puedes solicitarlo por separado.</p><div class="row" style="margin-top:22px"><button class="btn" data-route="jobs">Ver otras vacantes</button><button class="link" id="deleteData">Gestionar mis datos</button></div></div>`;if(a.state==='NO_CONTINUA')return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="card center-card"><div class="status-icon">✓</div><div class="eyebrow">Proceso finalizado</div><h1>Gracias por participar.</h1><p>En esta oportunidad no continuarás en el proceso para <b>${j.title}</b>. Agradecemos el tiempo y la dedicación que compartiste.</p><div class="callout" style="margin-top:22px"><b>Futuras convocatorias</b><p>Tus datos quedarán guardados según el consentimiento aceptado. Para participar en otra vacante tendrás que postular nuevamente.</p></div><div class="row" style="margin-top:22px"><button class="btn" data-route="jobs">Ver otras vacantes</button><button class="link" id="deleteData">Gestionar mis datos</button></div></div>`;if(a.stage===4)return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="card center-card"><div class="status-icon">7</div><div class="eyebrow">Validación de siete días</div><h1>Tu validación está en curso.</h1><p>El responsable del área registrará nueve métricas sobre el trabajo real. Si una predicción anterior no coincide con el resultado, prevalece la evidencia del trabajo.</p><div class="timeline"><div class="event"><b>Inicio registrado</b><p>Día 1 · expediente abierto</p></div><div class="event"><b>Trabajo en curso</b><p>Día 4 · esperando métricas del jefe del área</p></div><div class="event"><b>Decisión final</b><p>Pendiente al finalizar el día 7</p></div></div></div>`;return `<button class="back" data-route="dashboard">← Volver a mis postulaciones</button><div class="card center-card"><div class="status-icon">…</div><div class="eyebrow">${stages[Math.min(a.stage,4)]}</div><h1>Tu proceso sigue activo.</h1><p>Cuando exista una acción pendiente aparecerá en “Mis postulaciones” y recibirás un correo que te llevará al portal.</p><button class="btn primary" data-route="dashboard">Volver al panel</button></div>`}
  function loginRequired(){return `<div class="card center-card"><div class="status-icon">R</div><div class="eyebrow">Acceso necesario</div><h1>Ingresa para ver tu proceso.</h1><p>Las evaluaciones y el estado de las postulaciones solo están disponibles dentro de tu cuenta.</p><button class="btn primary large" id="loginRequiredBtn">Ingresar a la demostración</button></div>`}
  function bind(route,args){
    $$('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));$$('[data-job]').forEach(b=>b.onclick=()=>go('job/'+b.dataset.job));$$('[data-apply]').forEach(b=>b.onclick=()=>go((state.registered?'apply/':'register/')+b.dataset.apply));
    const create=$('#createAccount');if(create)create.onclick=()=>{const name=$('#regName').value.trim(),email=$('#regEmail').value.trim(),p=$('#regPass').value,p2=$('#regPass2').value;if(!name||!email.includes('@')||p.length<8||p!==p2||!$('#consent').checked)return $('#registerError').classList.add('show');state.registered=true;state.name=name;state.email=email;save();go('apply/'+args[0]);toast('Cuenta creada. Ahora completa tu postulación.')};
    const privacy=$('#privacyLink');if(privacy)privacy.onclick=()=>openModal('Tratamiento de datos','<div class="stack"><div class="callout"><b>Finalidad</b><p>Tus datos se usan para evaluar las postulaciones que tú envías.</p></div><div class="callout"><b>Participación de IA</b><p>Una inteligencia artificial ayuda a calificar y siempre conserva una explicación.</p></div><div class="callout"><b>Almacenamiento</b><p>Los datos pueden alojarse fuera del Perú. Puedes solicitar su eliminación.</p></div></div>');
    const choose=$('#chooseFile'),file=$('#cvFile');if(choose&&file){choose.onclick=()=>file.click();file.onchange=()=>{$('#fileName').textContent=file.files[0]?.name||'Sube tu CV'}}
    const submit=$('#submitApplication');if(submit)submit.onclick=()=>{if(!file?.files?.length||!$('#achievement').value.trim())return $('#applyError').classList.add('show');const existing=state.applications.find(a=>a.job===args[0]);if(!existing)state.applications.unshift({id:'app-'+Date.now(),job:args[0],stage:0,state:'CV_CALIFICANDO',days:0});save();go('dashboard');toast('Postulación recibida. Te avisaremos cuando avance.')};
    $$('[data-app-action]').forEach(b=>b.onclick=()=>{const a=app(b.dataset.appAction);if(a.stage===1)go('evaluation/'+a.id);else if(a.stage===2)go('challenge/'+a.id);else if(a.stage===3)go('simulation/'+a.id);else go('status/'+a.id)});$$('[data-status]').forEach(b=>b.onclick=()=>go('status/'+b.dataset.status));
    const answerRadios=$$('input[name="answer"]');answerRadios.forEach(r=>r.onchange=()=>{state.evaluationAnswer=r.value;save();flashSaved()});const text=$('#textAnswer');if(text)text.oninput=()=>{state.evaluationAnswer=text.value;save();flashSaved()};const next=$('#nextQuestion');if(next)next.onclick=()=>{if(!String(state.evaluationAnswer).trim())return $('#questionError').classList.add('show');state.evaluationIndex++;state.evaluationAnswer='';save();if(state.evaluationIndex>=questions.length){const a=app(args[0]);a.stage=2;a.state='PRUEBA_PENDIENTE';save();go('challenge/'+a.id);toast('Evaluación completada. Tu prueba del puesto está disponible.')}else render('evaluation',args)};
    const start=$('#startChallenge');if(start)start.onclick=()=>{openModal('¿Empezar ahora?','<div class="callout warn"><b>El tiempo no se detendrá</b><p>Si cierras el navegador, el cronómetro seguirá corriendo. Al terminar, se entregará lo que hayas guardado.</p></div>','<button class="btn" data-close>Aún no</button><button class="btn primary" id="confirmStart">Sí, empezar</button>');$('#confirmStart').onclick=()=>{state.challengeStart=Date.now();save();closeModal();render('challenge',args)}};
    const trigger=$('#triggerChange');if(trigger)trigger.onclick=()=>{state.changeStart=Date.now();save();render('challenge',args);toast('Cambio inesperado activado para la demostración.')};const finish=$('#finishChallenge');if(finish)finish.onclick=()=>openModal('Entregar prueba','<p class="small">Después de entregar no podrás modificar archivos ni enlaces.</p><div class="field"><label>¿Dónde podría fallar tu solución?</label><textarea id="finalReflection" placeholder="Explica un riesgo y cómo lo verificarías."></textarea><div class="error" id="reflectionError">Escribe una autocrítica breve para entregar.</div></div>','<button class="btn" data-close>Seguir revisando</button><button class="btn primary" id="confirmFinish">Entregar</button>');document.addEventListener('click',finishHandler);
    $$('input[name="date"]').forEach(r=>r.onchange=()=>{$$('.date-option').forEach(x=>x.classList.remove('selected'));r.closest('.date-option').classList.add('selected')});const confirmDate=$('#confirmDate');if(confirmDate)confirmDate.onclick=()=>{const d=$('input[name="date"]:checked');if(!d)return $('#dateError').classList.add('show');state.simulationDate=d.value;save();render('simulation',args);toast('Asistencia confirmada.')};const simulate=$('#simulateValidation');if(simulate)simulate.onclick=()=>{const a=app(args[0]);a.stage=4;a.state='VALIDACION_EN_CURSO';save();go('status/'+a.id);toast('Avance simulado a Validación de siete días.')};
    const privacyManage=$('#privacyManage');if(privacyManage)privacyManage.onclick=privacyOptions;const deleteData=$('#deleteData');if(deleteData)deleteData.onclick=privacyOptions;const loginBtn=$('#loginRequiredBtn');if(loginBtn)loginBtn.onclick=loginDemo;
    updateTimers();
  }
  function finishHandler(e){if(e.target.id!=='confirmFinish')return;const reflection=$('#finalReflection');if(!reflection?.value.trim())return $('#reflectionError').classList.add('show');const parts=(location.hash||'').slice(1).split('/'),a=app(parts[1]);a.stage=3;a.state='SIMULACION_POR_CONFIRMAR';state.challengeDelivered=true;state.challengeStart=null;state.changeStart=null;save();closeModal();go('simulation/'+a.id);toast('Prueba entregada. Ahora elige tu simulación.')}
  function flashSaved(){const el=$('#saveText');if(!el)return;el.textContent='Guardando…';setTimeout(()=>{if($('#saveText'))$('#saveText').textContent='Respuesta guardada'},350)}
  function updateTimers(){clearInterval(updateTimers.t);const main=$('#mainTimer'),change=$('#changeTimer');if(!main&&!change)return;const currentJob=job(app((location.hash||'').split('/')[1])?.job);const tick=()=>{if(main)main.textContent=fmtTime(currentJob.duration*60-(Date.now()-state.challengeStart)/1000);if(change)change.textContent=fmtTime(currentJob.extra*60-(Date.now()-state.changeStart)/1000)};tick();updateTimers.t=setInterval(tick,1000)}
  function loginDemo(){state.registered=true;save();closeModal();go('dashboard');toast('Acceso de demostración iniciado.')}
  function loginModal(){openModal('Ingresar','<div class="formgrid"><div class="field full"><label>Correo</label><input type="email" value="camila@ejemplo.pe"></div><div class="field full"><label>Contraseña</label><input type="password" value="Demo12345!"></div></div><div class="callout" style="margin-top:15px"><b>Acceso de demostración</b><p>No se enviará información ni se validará una contraseña real.</p></div>','<button class="btn" data-close>Cancelar</button><button class="btn primary" id="demoLogin">Entrar</button>');$('#demoLogin').onclick=loginDemo}
  function privacyOptions(){const active=state.applications.filter(a=>a.stage<5);openModal('Privacidad y control',`<div class="stack"><div class="callout"><b>Retirar una postulación</b><p>Dejarás de recibir avisos de esa vacante. Retirarte no elimina tus datos.</p>${active.map(a=>`<div class="row" style="margin-top:10px"><span class="small">${job(a.job).title}</span><button class="link" data-withdraw="${a.id}">Retirar</button></div>`).join('')||'<p>No tienes postulaciones activas.</p>'}</div><div class="callout"><b>Solicitar eliminación de datos</b><p>Se eliminarán datos personales y respuestas; la auditoría permanecerá sin identificarte.</p></div></div>`,'<button class="btn" id="resetDemo">Restablecer demo</button><button class="btn" data-close>Cerrar</button><button class="btn danger" id="requestDelete">Solicitar eliminación</button>');$$('[data-withdraw]').forEach(b=>b.onclick=()=>{const a=app(b.dataset.withdraw);a.stage=5;a.state='CERRADA';save();closeModal();go('status/'+a.id);toast('Postulación retirada. Ya no recibirás avisos.')});$('#resetDemo').onclick=()=>{state=clone(initial);save();closeModal();go('jobs');toast('Datos de demostración restablecidos.')};$('#requestDelete').onclick=()=>{closeModal();toast('Solicitud registrada para la demostración.')}}
  $('#brandHome').onclick=()=>go('jobs');$('#dashboardLink').onclick=()=>state.registered?go('dashboard'):loginModal();$('#accountBtn').onclick=()=>state.registered?privacyOptions():loginModal();$('#themeBtn').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();parse()};$('#overlay').onclick=closeModal;$('#modalClose').onclick=closeModal;window.addEventListener('hashchange',parse);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});parse();
})();
</script>
