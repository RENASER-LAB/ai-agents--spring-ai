* { box-sizing: border-box; }
body { margin: 0; background: var(--cielo); color: var(--tinta); font-family: var(--fuente); font-size: var(--t-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
b { font-weight: 550; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--regla2); text-underline-offset: 0.22em; transition: text-decoration-color 150ms var(--curva-control); }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--activo); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.cabecera { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--cielo); border-bottom: 1px solid var(--filete); }
.cabecera-dentro { min-height: 68px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2); display: inline-flex; gap: 6px; }
.menu span { color: var(--tinta3); }

.campana-cab { justify-self: end; width: 36px; height: 36px; display: grid; place-items: center; color: var(--tinta2); }

.carril { max-width: 76rem; margin: 0 auto; padding-block: var(--e7) 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--fuente-ui); font-size: var(--t-etiqueta); letter-spacing: var(--tracking-etiqueta); text-transform: uppercase; color: var(--tinta-etiqueta); }

/* El título con el botón de notificaciones a su lado. */
.encabezado { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--e4) var(--e6); }
.titular { margin-top: var(--e3); font-size: var(--t-pagina); font-weight: 400; letter-spacing: var(--tracking-titular); line-height: 1.02; text-wrap: balance; }
.entradilla { margin-top: var(--e3); color: var(--tinta2); font-size: var(--t-prosa); max-width: 52ch; }
.ancla { position: relative; }
.notif { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 14px 8px 10px; border: 1px solid var(--filete); border-radius: var(--radio-control); background: var(--nube); cursor: pointer; transition: border-color 150ms var(--curva-control), background-color 150ms var(--curva-control), transform 160ms var(--salida); }
.notif:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .notif:hover { border-color: var(--regla2); background: color-mix(in srgb, var(--tinta) 2%, var(--nube)); } }
.notif .icono { position: relative; width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--radio-menor); background: var(--cielo-hundido); color: var(--tinta); }
.notif .icono::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--whatsapp); box-shadow: 0 0 0 2px var(--cielo-hundido); transform: scale(0); transition: transform 220ms var(--ease-out); }
.notif[data-wa="on"] .icono::after { transform: scale(1); }
.notif .textos { display: grid; text-align: left; line-height: 1.25; }
.notif .textos b { font-size: var(--t-apoyo); font-weight: 550; }
.notif .textos span { font-size: 12px; color: var(--tinta3); }

/* El mensajito flotante: sale del botón (origen arriba a la derecha), no del centro. */
.globo { position: absolute; right: 0; top: calc(100% + 12px); z-index: 15; border: 1px solid var(--regla2); border-radius: var(--radio); background: var(--nube); color: var(--tinta); box-shadow: 0 20px 50px rgb(15 23 42 / 0.16), 0 2px 8px rgb(15 23 42 / 0.08); transform-origin: top right; transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); @starting-style { opacity: 0; transform: scale(0.96) translateY(-4px); } }
.globo::before { content: ""; position: absolute; top: -7px; right: 30px; width: 12px; height: 12px; background: var(--nube); border-left: 1px solid var(--regla2); border-top: 1px solid var(--regla2); transform: rotate(45deg); border-radius: 2px 0 0 0; }
.globo h3 { font-size: var(--t-base); font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; }
.globo .sub { font-size: var(--t-menor); color: var(--tinta2); line-height: 1.4; }
.globo .boton { min-height: 36px; padding: 7px 14px; }
.ico-wa { flex: none; width: 36px; height: 36px; border-radius: var(--radio-control); display: grid; place-items: center; background: var(--whatsapp); color: var(--tinta); }
.x { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: var(--radio-menor); background: none; color: var(--tinta3); cursor: pointer; transition: background-color 150ms var(--curva-control), transform 160ms var(--salida); }
.x:active { transform: scale(0.92); }
@media (hover: hover) and (pointer: fine) { .x:hover { background: var(--cielo-hundido); color: var(--tinta); } }
/* 1 · Píldora: una sola línea. */
.globo.v1 { display: flex; align-items: center; gap: var(--e3); padding: 8px 8px 8px 10px; white-space: nowrap; border-radius: 999px; }
.globo.v1 .ico-wa { width: 32px; height: 32px; border-radius: 50%; }
.globo.v1 h3 { font-size: var(--t-apoyo); }
.globo.v1 .boton { border-radius: 999px; min-height: 34px; }
@media (max-width: 640px) { .globo.v1 { white-space: normal; width: calc(100vw - 32px); border-radius: 12px; } }
/* 2 · Esquina verde: dos líneas, botón a la derecha. */
.globo.v2 { width: min(380px, calc(100vw - 32px)); display: grid; grid-template-columns: 1fr auto; gap: 2px var(--e4); align-items: center; padding: var(--e4); border-left: 4px solid var(--whatsapp); }
.globo.v2 .x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; }
.globo.v2 .boton { grid-row: span 2; }
.globo.v2 h3 { padding-right: 18px; }
/* 3 · Centrada: ícono grande, título y botón a lo ancho. */
.globo.v3 { width: min(260px, calc(100vw - 32px)); padding: var(--e5) var(--e4) var(--e4); text-align: center; display: grid; justify-items: center; gap: var(--e2); }
.globo.v3 .ico-wa { width: 48px; height: 48px; border-radius: 50%; margin-bottom: 4px; }
.globo.v3 .boton { width: 100%; margin-top: var(--e2); }
.globo.v3 .ahora-no { font-size: 12px; }
.globo.v3 .x { position: absolute; top: 8px; right: 8px; }
/* 4 · Nota: casi un tooltip, con el enlace dentro de la frase. */
.globo.v4 { width: min(290px, calc(100vw - 32px)); display: flex; gap: var(--e3); align-items: flex-start; padding: var(--e3) var(--e3) var(--e3) var(--e4); }
.globo.v4 p { font-size: var(--t-apoyo); line-height: 1.45; }
.globo.v4 .enlace { border: 0; padding: 0; background: none; cursor: pointer; font-weight: 550; color: #128c4a; text-decoration: underline; text-decoration-color: rgb(18 140 74 / 0.35); text-underline-offset: 0.22em; }
@media (hover: hover) and (pointer: fine) { .globo.v4 .enlace:hover { text-decoration-color: currentColor; } }
.globo.v4 .x { margin: -4px -4px 0 0; }
.globo .ahora-no { color: var(--tinta2); text-decoration-color: var(--regla2); }
.notif.con-globo { border-color: var(--whatsapp); box-shadow: 0 0 0 3px rgb(37 211 102 / 0.18); }
.globo.saliendo { opacity: 0; transform: scale(0.97); transition-duration: 140ms; }
@media (max-width: 640px) { .globo { right: auto; left: 0; transform-origin: top left; } .globo::before { right: auto; left: 28px; } }
.ahora-no { border: 0; background: none; font-size: var(--t-menor); cursor: pointer; padding: 8px; text-decoration: underline; text-underline-offset: 0.22em; transition: text-decoration-color 150ms var(--curva-control); }
@media (hover: hover) and (pointer: fine) { .ahora-no:hover { text-decoration-color: currentColor !important; } }
/* Propuesta B: una franja dentro de la página, sobre la lista. */
.franja { margin-top: var(--e6); display: grid; grid-template-columns: 48px 1fr auto; gap: var(--e4); align-items: center; padding: var(--e4) var(--e5); border: 1px solid rgb(30 58 138 / 0.18); border-left: 3px solid var(--whatsapp); border-radius: var(--radio); background: var(--activo-bruma); transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); @starting-style { opacity: 0; transform: translateY(-6px); } }
.franja .sello-wa { width: 48px; height: 48px; }
.franja .chip { font-family: var(--fuente-ui); font-size: var(--t-etiqueta); letter-spacing: var(--tracking-etiqueta); text-transform: uppercase; color: var(--activo); }
.franja h3 { margin-top: 2px; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; }
.franja p { margin-top: 2px; font-size: var(--t-apoyo); color: var(--tinta2); }
.franja .acciones { display: flex; gap: var(--e2); align-items: center; }
.franja .ahora-no { color: var(--tinta2); text-decoration-color: var(--regla2); }
.franja.saliendo { opacity: 0; transform: translateY(-4px); transition-duration: 140ms; }
@media (max-width: 640px) { .franja { grid-template-columns: 40px 1fr; padding: var(--e4); } .franja .sello-wa { width: 40px; height: 40px; } .franja .acciones { grid-column: 1 / -1; } .franja .acciones .boton { flex: 1; } }
.nota.baja { display: flex; gap: 8px; align-items: baseline; }

.celda { border: 1px solid var(--filete); border-radius: var(--radio-menor); background: var(--nube); }
.boton { display: inline-flex; align-items: center; justify-content: center; gap: var(--e2); min-height: 40px; padding: 9px 16px; border-radius: var(--radio-control); border: 1px solid rgb(0 0 0 / 0.1); background: var(--activo); color: #fff; font-size: var(--t-apoyo); font-weight: 400; line-height: 21px; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: background-color 150ms var(--curva-control), transform 160ms var(--salida); }
.boton:active:not(:disabled) { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .boton:hover:not(:disabled) { background: var(--activo-pulsado); } }
.boton.verde { background: var(--whatsapp); color: var(--tinta); }
@media (hover: hover) and (pointer: fine) { .boton.verde:hover:not(:disabled) { background: var(--whatsapp-pulsado); } }
.etapas { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.etapas i { height: 4px; border-radius: 2px; background: var(--regla); display: block; }
.etapas i.hecha { background: var(--activo); }
.etapas i.actual { background: linear-gradient(90deg, var(--activo) 0 14px, var(--regla) 14px); }
.etapas.cerrada i.hecha { background: var(--tinta3); }

.grupo { margin-top: var(--e7); }
.grupo > .eyebrow { display: block; padding-bottom: var(--e3); }
.tabla { overflow: hidden; }
.fila { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.6fr) minmax(0, 1.3fr) 150px; gap: var(--e3) var(--e5); align-items: center; padding: var(--e4) var(--e5); border-top: 1px solid var(--regla); transition: background-color 150ms var(--curva-control); }
.fila:first-child { border-top: 0; }
@media (hover: hover) and (pointer: fine) { .fila:hover { background: color-mix(in srgb, var(--cielo-hundido) 60%, var(--nube)); } }
.puesto { font-size: 17px; font-weight: 550; letter-spacing: -0.015em; }
.meta { font-size: var(--t-menor); color: var(--tinta3); margin-top: 2px; }
.etapa-nombre { font-size: var(--t-menor); color: var(--tinta2); margin-top: var(--e2); }
.que { font-size: var(--t-apoyo); color: var(--tinta2); line-height: 1.45; }
.que b { color: var(--tinta); display: block; }
.accion { display: flex; justify-content: flex-end; }
.accion a { font-size: var(--t-apoyo); }
.fila.cerrada .puesto, .fila.cerrada .que b { color: var(--tinta2); }
@media (max-width: 900px) { .fila { grid-template-columns: minmax(0, 1fr) auto; } .fila .progreso { grid-column: 1 / -1; order: 3; } .fila .que { grid-column: 1 / -1; order: 4; } }
@media (max-width: 560px) { .fila { grid-template-columns: minmax(0, 1fr); padding: var(--e4); } .accion { order: 5; justify-content: stretch; } .accion .boton { flex: 1; } }

/* La ventana: entra desde 0,96 y transparente (centrada, como toda ventana); sale más rápido. */
dialog.ventana { width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid var(--filete); border-radius: var(--radio); background: var(--nube); color: var(--tinta); box-shadow: var(--sombra-aviso); opacity: 1; transform: scale(1); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), overlay 200ms allow-discrete, display 200ms allow-discrete; @starting-style { opacity: 0; transform: scale(0.96); } }
dialog.ventana:not([open]) { opacity: 0; transform: scale(0.98); transition-duration: 140ms; }
dialog.ventana::backdrop { background: var(--velo); opacity: 1; transition: opacity 200ms var(--ease-out), overlay 200ms allow-discrete, display 200ms allow-discrete; @starting-style { opacity: 0; } }
dialog.ventana:not([open])::backdrop { opacity: 0; }
.v-cabeza { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e3); padding: var(--e5) var(--e5) var(--e3); }
.v-cabeza h2 { font-size: 22px; font-weight: 400; letter-spacing: -0.035em; line-height: 1.15; }
.v-cabeza p { margin-top: 4px; font-size: var(--t-menor); color: var(--tinta3); }

.cerrar:hover { background: var(--cielo-hundido); }
.cerrar:active { transform: scale(0.94); }
.canales { padding: 0 var(--e5) var(--e2); }
.canal { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--e1) var(--e3); align-items: center; padding: var(--e4) 0; border-top: 1px solid var(--regla); }
.canal .sello { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--regla); border-radius: var(--radio-menor); background: var(--cielo-hundido); color: var(--tinta2); transition: background-color 260ms var(--salida), color 260ms var(--salida), border-color 260ms var(--salida); }
.canal[data-on] .sello { background: var(--tinta); border-color: var(--tinta); color: var(--cielo); }

.canal .recomendado { font-family: var(--fuente-ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tinta2); border: 1px solid var(--regla2); border-radius: 3px; padding: 1px 5px; }
.canal .detalle { font-size: var(--t-menor); color: var(--tinta3); margin-top: 1px; }
.canal .nota { grid-column: 2 / -1; font-size: 12px; line-height: 1.5; color: var(--tinta3); margin-top: var(--e1); transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); @starting-style { opacity: 0; transform: translateY(-2px); } }
.canal .nota.aviso { color: var(--tinta2); }
.canal .nota.fallo { color: var(--mal); }
.canal .nota a { color: var(--tinta2); }
.alta-numero { display: grid; gap: 6px; }

.fila-numero { display: flex; gap: var(--e2); }
.fila-numero input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--regla2); border-radius: var(--radio-control); background: var(--nube); font: inherit; font-size: var(--t-apoyo); color: var(--tinta); font-variant-numeric: tabular-nums; transition: border-color 150ms var(--curva-control), box-shadow 150ms var(--curva-control); }
.fila-numero input:focus { outline: none; border-color: var(--activo); box-shadow: 0 0 0 3px var(--activo-bruma); }

/* El interruptor: la bolita se mueve con transform; al pulsar se ensancha un poco. */
.interruptor { position: relative; flex: none; width: 44px; height: 26px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; background: var(--regla2); transition: background-color 200ms var(--ease-out); }
.interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.2); transition: transform 200ms var(--ease-out), width 160ms var(--ease-out); }
.interruptor[aria-checked="true"] { background: var(--tinta); }

.interruptor[aria-checked="true"]::after { transform: translateX(18px); }
.interruptor:active:not(:disabled)::after { width: 24px; }
.interruptor[aria-checked="true"]:active:not(:disabled)::after { transform: translateX(14px); }
.interruptor[aria-busy="true"]::after { animation: latido 1s ease-in-out infinite; }

@keyframes latido { 50% { opacity: 0.55; } }

@media (prefers-reduced-motion: reduce) {

  .interruptor, .interruptor::after { transition: none; }
  .interruptor[aria-busy="true"]::after { animation: none; }
}

<header class="cabecera">

    <span class="campana-cab" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
  </div>
</header>

<main class="carril">

    <div>
      <p class="eyebrow">Mis procesos</p>

<dialog class="ventana" id="ventana" aria-labelledby="v-titulo"></dialog>
<div id="mesa"></div>

<script>
(() => {
  const I = {
    campana: (t = 16) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
    wa: (t = 18) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 20.4 4.9 16.5A8.6 8.6 0 1 1 7.9 19.3Z"/><path d="M9.1 8.3c.3-.6.9-.6 1.2 0l.6 1.3c.1.3.1.6-.2.8l-.5.5c.5 1.1 1.4 2 2.5 2.5l.5-.5c.2-.3.5-.3.8-.2l1.3.6c.6.3.6.9 0 1.2-.9.6-2 .7-3 .2a8 8 0 0 1-3.4-3.4c-.5-1-.4-2.1.2-3Z"/></svg>`,
    sobre: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>`,
    portal: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>`,
    x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  };
  const NUM = '+51 987 654 321', MASC = '+51 ••• ••• 321';
  const ETAPAS = ['Tu perfil', 'La prueba del puesto', 'La simulación de trabajo', 'El periodo de validación', 'La decisión final'];
  const PROCESOS = [
    { puesto: 'Analista de Datos', empresa: 'Clínica San Juan', desde: '30 oct', etapa: 1, grupo: 'toca', tarea: 'Prueba del puesto habilitada', sub: 'Hasta el viernes 28 · 11:59 p. m.', boton: 'Abrir prueba' },
    { puesto: 'Especialista en Mejora Continua', empresa: 'Molinos del Norte', desde: '13 oct', etapa: 2, grupo: 'toca', tarea: 'Confirma tu simulación', sub: '3 días sin cambios', boton: 'Elegir fecha' },
    { puesto: 'Analista de Planeamiento', empresa: 'Andes Retail', desde: '17 nov', etapa: 0, grupo: 'espera', tarea: 'Estamos calificando tus respuestas', sub: 'No tienes que hacer nada.' },
    { puesto: 'Jefe/a de Servicio al Cliente', empresa: 'Clínica San Juan', desde: '7 set', etapa: 2, grupo: 'cerrado', tarea: 'Gracias por participar', sub: '' },
  ];

  // Situación de la cuenta al entrar (barra de abajo).
  //   baja: escribió BAJA; su número ya estuvo vinculado, así que se activa con un clic.
  //   primera: nunca escribió desde ese número; tiene que mandar el mensaje.
  //   sinNumero / otraCuenta: su cuenta no tiene celular (y el que escribe ya es de otra cuenta).
  //   cambio: cambió de número; el nuevo hay que comprobarlo con un mensaje.
  //   noLlego: abrió el chat hace más de 24 h y el mensaje nunca llegó.
  let situacion = 'baja';
  let comprobado = true;   // el número de la cuenta ya escribió alguna vez: clic directo
  let porBaja = true;      // está apagado porque escribió BAJA
  let numero = NUM;        // null = la cuenta no tiene celular
  let errorNumero = '';
  function entrar(sit) {
    situacion = sit; errorNumero = '';
    comprobado = sit === 'baja'; porBaja = sit === 'baja';
    numero = sit === 'sinNumero' || sit === 'otraCuenta' ? null : sit === 'cambio' ? '+51 912 345 678' : NUM;
    wa = sit === 'noLlego' ? 'caducado' : 'apagado';
    recienActivado = false; globoVisible = sit !== 'sinNumero' && sit !== 'otraCuenta';
  }
  let fallaraElCrm = false;
  // WhatsApp: apagado | activando | esperando (primera vez: se abrió el chat) | activo | fallo
  let wa = 'apagado';
  let recienActivado = false;
  const canal = { correo: true, portal: true };
  let globoVisible = true;
  let estilo = 'v3';
  const textoAviso = () => porBaja
    ? { h: 'Vuelve a recibir tus avisos por WhatsApp', p: 'Los apagaste con BAJA.' }
    : situacion === 'cambio'
      ? { h: 'Activa WhatsApp en tu número nuevo', p: 'Te pediremos un mensaje para comprobarlo.' }
      : { h: 'Recibe tus avisos por WhatsApp', p: 'Y pregúntanos tus dudas.' };

  const etapas = (p) => `<div class="etapas${p.grupo === 'cerrado' ? ' cerrada' : ''}" aria-hidden="true">${ETAPAS.map((_, i) => `<i class="${i < p.etapa ? 'hecha' : i === p.etapa && p.grupo !== 'cerrado' ? 'actual' : ''}"></i>`).join('')}</div>`;
  function pintarLista() {
    const grupo = (clave, titulo) => {
      const filas = PROCESOS.filter((p) => p.grupo === clave);
      return `<section class="grupo"><span class="eyebrow">${titulo} · ${filas.length}</span><div class="tabla celda">${filas.map((p) => `
        <div class="fila ${clave === 'cerrado' ? 'cerrada' : ''}">
          <div><p class="puesto">${p.puesto}</p><p class="meta">${p.empresa} · Postulaste el ${p.desde}</p></div>
          <div class="progreso">${etapas(p)}<p class="etapa-nombre">${clave === 'cerrado' ? 'Proceso cerrado' : `${p.etapa + 1} de 5 · ${ETAPAS[p.etapa]}`}</p></div>
          <p class="que"><b>${p.tarea}</b>${p.sub || '&nbsp;'}</p>
          <div class="accion">${clave === 'toca' ? `<button type="button" class="boton">${p.boton}</button>` : `<a href="#">${clave === 'espera' ? 'Ver detalle' : 'Ver vacantes abiertas'}</a>`}</div>
        </div>`).join('')}</div></section>`;
    };
    document.getElementById('lista').innerHTML = grupo('toca', 'Te toca') + grupo('espera', 'En espera') + grupo('cerrado', 'Cerrados');
  }

  function resumen() {
    if (wa === 'activo') return 'WhatsApp activo';
    if (wa === 'esperando') return 'Esperando tu mensaje';
    if (!numero) return 'WhatsApp sin número';
    if (wa === 'caducado') return 'No llegó tu mensaje';
    return porBaja ? 'WhatsApp apagado por BAJA' : 'WhatsApp apagado';
  }
  function pintarAncla() {
    document.getElementById('ancla').innerHTML = `
      <button type="button" class="notif${globoVisible && numero && (wa === 'apagado' || wa === 'activando') ? ' con-globo' : ''}" id="abrir" data-wa="${wa === 'activo' ? 'on' : 'off'}" aria-haspopup="dialog">
        <span class="icono">${I.campana()}</span>
        <span class="textos"><b>Notificaciones</b><span>${resumen()}</span></span>
      </button>
      ${globoVisible && numero && (wa === 'apagado' || wa === 'activando') ? (() => { const t = textoAviso(); const x = `<button type="button" class="x" data-globo-cerrar aria-label="Ahora no">${I.x}</button>`; const act = (txt = 'Activar') => `<button type="button" class="boton verde" data-globo-activar>${txt}</button>`;
        const cuerpo = {
          v1: `<span class="ico-wa">${I.wa(16)}</span><h3>${comprobado ? 'Vuelve a recibir avisos por WhatsApp' : 'Recibe avisos por WhatsApp'}</h3>${act()}${x}`,
          v2: `<h3>${t.h}</h3>${act()}<p class="sub">${t.p}</p>${x}`,
          v3: `${x}<span class="ico-wa">${I.wa(24)}</span><h3>${t.h}</h3><p class="sub">${t.p}</p>${act('Activar WhatsApp')}`,
          v4: `<p>${comprobado ? 'Apagaste tus avisos con BAJA.' : '¿Te avisamos por WhatsApp?'} <button type="button" class="enlace" data-globo-activar>${comprobado ? 'Volver a activarlos' : 'Activar'}</button></p>${x}`,
        }[estilo];
        return `<div class="globo ${estilo}" role="dialog" aria-label="Avisos por WhatsApp" id="globo">${cuerpo}</div>`; })() : ''}`;
    const f = document.getElementById('franja');
    if (globoVisible && wa !== 'activo' && estilo === 'franja') {
      const t = textoAviso();
      f.innerHTML = `<section class="franja" id="globo" aria-label="WhatsApp"><span class="sello-wa">${I.wa(22)}</span>
        <div><span class="chip">${t.chip}</span><h3>${t.h}</h3><p>${t.p}</p></div>
        <div class="acciones"><button type="button" class="boton verde" data-globo-activar>Activar WhatsApp</button><button type="button" class="ahora-no" data-globo-cerrar>Ahora no</button></div></section>`;
    } else f.innerHTML = '';
  }
  function cerrarGlobo() {
    const g = document.getElementById('globo');
    globoVisible = false;
    if (!g) return;
    g.classList.add('saliendo');
    setTimeout(pintarAncla, 140);
  }

  const ventana = document.getElementById('ventana');
  function interruptor(id, on, { verde = false, ocupado = false, etiqueta }) {
    return `<button type="button" class="interruptor${verde ? ' verde' : ''}" role="switch" data-canal="${id}" aria-checked="${on}" aria-label="${etiqueta}" ${ocupado ? 'disabled aria-busy="true"' : ''}></button>`;
  }
  function notaWa() {
    if (wa === 'activando') return `<p class="nota">Activando…</p>`;
    if (wa === 'fallo') return `<p class="nota fallo" role="alert">No pudimos activarlo. Vuelve a intentarlo en un momento.</p>`;
    if (!numero) return `<form class="nota alta-numero" data-guardar-numero><label for="cel">Agrega tu celular para recibir avisos por WhatsApp.</label><span class="fila-numero"><input id="cel" inputmode="tel" autocomplete="tel" value="+51 955 111 222" aria-invalid="${!!errorNumero}"><button type="submit" class="boton chico">Guardar</button></span>${errorNumero ? `<span class="error" role="alert">${errorNumero}</span>` : ''}</form>`;
    if (wa === 'esperando') return `<p class="nota aviso">Te abrimos WhatsApp. Envía el mensaje desde el <span class="num">${numero}</span> para terminar. <a href="#" data-simular-mensaje>Ya lo envié</a></p>`;
    if (wa === 'caducado') return `<p class="nota fallo" role="alert">No nos llegó tu mensaje desde el <span class="num">${numero}</span>. <a href="#" data-reintentar>Reintentar</a></p>`;
    if (wa === 'activo') return `<p class="nota">${recienActivado ? 'Te enviamos un mensaje para confirmarlo. ' : ''}Te avisamos de todos tus procesos y puedes escribirnos tus dudas.</p>`;
    if (situacion === 'cambio' && !comprobado) return `<p class="nota aviso">Cambiaste tu número. Actívalo y envía un mensaje desde el nuevo para comprobarlo.</p>`;
    if (porBaja) return `<p class="nota">Lo apagaste escribiendo BAJA el 12 nov. Actívalo y vuelves a recibir por aquí las novedades de tus procesos; te llegará un mensaje para confirmarlo. Escribe BAJA cuando quieras dejarlo.</p>`;
    return `<p class="nota">Al activarlo aceptas recibir por WhatsApp las novedades de tus procesos. Escribe BAJA cuando quieras dejarlo.${comprobado ? '' : ' ¿No es tu número? <a href="#">Cámbialo en Mi cuenta</a>.'}</p>`;
  }
  function pintarVentana() {
    const waOn = wa === 'activo' || wa === 'esperando';
    ventana.innerHTML = `
      <div class="v-cabeza">
        <div><h2 id="v-titulo">Notificaciones</h2><p>Para todos tus procesos.</p></div>
        <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">${I.x}</button>
      </div>
      <div class="canales">
        <div class="canal wa" ${wa === 'activo' ? 'data-on' : ''}>
          <span class="sello">${I.wa()}</span>
          <div><p class="nombre">WhatsApp <span class="recomendado">Recomendado</span></p><p class="detalle num">${!numero ? 'Sin número' : wa === 'activo' ? numero.replace(/(\+\d+) \d+ \d+ (\d+)/, '$1 ••• ••• $2') : numero}</p></div>
          ${numero ? interruptor('wa', waOn, { verde: true, ocupado: wa === 'activando', etiqueta: 'Notificaciones por WhatsApp' }) : '<span></span>'}
          ${notaWa()}
        </div>
        <div class="canal" ${canal.correo ? 'data-on' : ''}>
          <span class="sello">${I.sobre}</span>
          <div><p class="nombre">Correo</p><p class="detalle">lucia.paredes@correo.com</p></div>
          ${interruptor('correo', canal.correo, { etiqueta: 'Notificaciones por correo' })}
          ${canal.correo ? '' : '<p class="nota aviso">No te llegarán por correo los plazos de tus pruebas. Los verás aquí, en el portal.</p>'}
        </div>
        <div class="canal" ${canal.portal ? 'data-on' : ''}>
          <span class="sello">${I.portal}</span>
          <div><p class="nombre">En el portal</p><p class="detalle">La campana de arriba</p></div>
          ${interruptor('portal', canal.portal, { etiqueta: 'Notificaciones en el portal' })}
          ${canal.portal ? '' : '<p class="nota aviso">La campana dejará de marcar novedades. Tus procesos siguen mostrando su estado.</p>'}
        </div>
      </div>
      <p class="v-pie">Te avisamos cuando cambia tu proceso o cuando te toca hacer algo. Nunca publicidad.</p>`;
  }
  function abrir() { cerrarGlobo(); pintarVentana(); ventana.showModal(); }
  function activarWa() {
    if (!numero) return;
    if (!comprobado) { wa = 'esperando'; todo(); return; }
    wa = 'activando'; todo();
    setTimeout(() => { wa = fallaraElCrm ? 'fallo' : 'activo'; recienActivado = wa === 'activo'; todo(); }, 900);
  }
  function todo() { pintarAncla(); if (ventana.open) pintarVentana(); }

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('#abrir')) { abrir(); return; }
    if (t.closest('[data-globo-cerrar]')) { cerrarGlobo(); return; }
    if (t.closest('[data-globo-activar]')) { abrir(); activarWa(); return; }
    if (t.closest('[data-cerrar]')) { ventana.close(); return; }
    if (t.closest('[data-simular-mensaje]')) { e.preventDefault(); wa = 'activo'; recienActivado = false; comprobado = true; porBaja = false; todo(); return; }
    if (t.closest('[data-reintentar]')) { e.preventDefault(); wa = 'esperando'; todo(); return; }
    if (t.closest('a[href="#"]')) e.preventDefault();
    const sw = t.closest('[data-canal]');
    if (sw && !sw.disabled) {
      const id = sw.dataset.canal;
      if (id === 'wa') {
        if (wa === 'activo' || wa === 'esperando') { wa = 'apagado'; recienActivado = false; porBaja = false; todo(); }
        else activarWa();
      } else { canal[id] = !canal[id]; pintarVentana(); }
    }
  });
  ventana.addEventListener('click', (e) => { if (e.target === ventana) ventana.close(); });
  ventana.addEventListener('submit', (e) => {
    if (!e.target.matches('[data-guardar-numero]')) return;
    e.preventDefault();
    if (situacion === 'otraCuenta') { errorNumero = 'Ese número ya está en otra cuenta. Usa otro o entra con esa cuenta.'; pintarVentana(); return; }
    numero = e.target.querySelector('input').value.trim(); comprobado = false; porBaja = false; wa = 'apagado'; pintarVentana(); pintarAncla();
  });

  const sombra = document.getElementById('mesa').attachShadow({ mode: 'open' });
  sombra.innerHTML = `<style>
    .mesa { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: calc(100vw - 32px); padding: 8px; border-radius: 10px; background: #111312; color: #fcfcfa; font: 13px/1.4 Onest, system-ui, sans-serif; box-shadow: 0 12px 40px rgb(0 0 0 / .22); }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid rgb(255 255 255 / .18); border-radius: 6px; padding: 7px 12px; cursor: pointer; transition: background-color 150ms ease, transform 160ms cubic-bezier(.16,1,.3,1); }
    button:active { transform: scale(.97); }
    button[aria-pressed="true"] { background: #fcfcfa; color: #111312; border-color: #fcfcfa; }
    .sep { width: 1px; align-self: stretch; background: rgb(255 255 255 / .18); margin: 0 4px; }
    label { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; color: rgb(252 252 250 / .8); cursor: pointer; }
    @media (max-width: 560px) { .mesa { gap: 4px; padding: 6px; font-size: 12px; } button { padding: 6px 9px; } }
  </style><div class="mesa" role="group" aria-label="Maqueta"></div>`;
  const mesa = sombra.querySelector('.mesa');
  function pintarMesa() {
    const SIT = [['baja', 'Tras BAJA'], ['primera', 'Primera vez'], ['sinNumero', 'Sin número'], ['otraCuenta', 'Número de otra cuenta'], ['cambio', 'Cambió de número'], ['noLlego', 'No llegó el mensaje']];
    mesa.innerHTML = `${SIT.map(([k, t]) => `<button type="button" data-c="${k}" aria-pressed="${situacion === k}">${t}</button>`).join('')}
      <span class="sep"></span><button type="button" data-globo>Ver el mensajito</button>
      <label><input type="checkbox" data-falla ${fallaraElCrm ? 'checked' : ''}> Que falle</label>`;
  }
  mesa.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.c) { entrar(b.dataset.c); pintarMesa(); todo(); }
    if (b.dataset.e) { estilo = b.dataset.e; pintarMesa(); }
    if (b.dataset.e || b.hasAttribute('data-globo')) { if (ventana.open) ventana.close(); entrar(situacion === 'sinNumero' || situacion === 'otraCuenta' ? 'primera' : situacion); pintarMesa(); todo(); scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  mesa.addEventListener('change', (e) => { if (e.target.matches('[data-falla]')) fallaraElCrm = e.target.checked; });

  pintarLista(); pintarAncla(); pintarMesa();
})();
</script>
