<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas · propuesta Emil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Tokens de src/estilos/mundo.css (modo claro, sin inventar nada) */
  --cielo:#f9fafb; --cielo-hundido:#f3f4f6; --nube:#ffffff; --nube-hundida:#f3f4f6; --nube-honda:#e5e7eb;
  --tinta:#101828; --tinta2:#364153; --tinta3:#6a7282; --regla:#e5e7eb; --regla2:#d1d5dc; --borde-control:#6a7282;
  --tinta-invertida:#ffffff; --tinta-pulsado:#0a0a0a;
  --activo:#615fff; --activo-pulsado:#4f46e5; --activo-bruma:rgb(97 95 255 / .2); --activo-regla:#615fff;
  --accion-fuerte:#030712;
  --bien:#0b7a63; --bien-bruma:#e6f5f0;
  --duda:#8f5a0a; --duda-bruma:#fbf2e4; --duda-tinta:#6d4406;
  --mal:#c22a3f; --mal-pulsado:#9e2134; --mal-bruma:#fdedf0; --mal-regla:#f3c3cc;
  --canto:linear-gradient(90deg,#a5b4fc 0%,#818cf8 34%,#615fff 68%,#4f46e5 100%);
  --t-micro:12px; --t-menor:13px; --t-apoyo:14px; --t-prosa:15px; --t-base:16px; --t-entradilla:18px; --t-titulo:20px;
  --t-destacado:clamp(24px,2.4vw,30px); --t-portada:clamp(36px,5.2vw,60px);
  --medida:50ch;
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:48px; --e8:72px;
  --radio:12px; --radio-menor:8px; --radio-control:8px; --radio-marca:4px;
  --salida:cubic-bezier(0.16,1,0.3,1); --curva-control:cubic-bezier(0.4,0,0.2,1);
  --sombra-nube:0 1px 2px rgb(10 10 10 / .05),0 8px 24px rgb(10 10 10 / .06);
  --sombra-aviso:0 12px 24px rgb(10 10 10 / .10),0 32px 64px rgb(10 10 10 / .14);
  --sombra-control:0 3px 7px rgb(130 130 130 / .15),0 12px 12px rgb(130 130 130 / .13),0 27px 16px rgb(130 130 130 / .08);
  --sombra-control-alta:0 10px 15px -3px rgb(10 10 10 / .1),0 4px 6px -4px rgb(10 10 10 / .1);
  --velo:rgb(10 10 10 / .4);
  --alto-barra:58px; --lat:15rem; --ancho-panel:120rem;
  /* Curva de cajón para la hoja (pieza nueva; misma familia que --salida) */
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  color-scheme:light;
}
:root[data-plegado="true"]{--lat:4.25rem}
@media (max-width:1023.98px){:root,:root[data-plegado="true"]{--lat:0px}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--cielo);scroll-padding-top:calc(var(--alto-barra) + var(--e4))}
body{margin:0;background:var(--cielo);color:var(--tinta);font-family:Geist,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1{font-size:var(--t-portada);line-height:1;font-weight:600;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--activo-pulsado)}
:focus-visible{outline:2px solid var(--activo);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.mono{font-variant-numeric:tabular-nums}
kbd{font:600 var(--t-micro)/1 Geist,system-ui,sans-serif;color:var(--tinta3);border:1px solid var(--regla2);border-radius:var(--radio-marca);padding:3px 6px;background:var(--nube);white-space:nowrap}
svg{flex:none}

/* ---------- Botones: los de piezas.module.css (acentoMenor, secundario) + respuesta al pulsar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--e2);min-height:44px;padding:12px var(--e4);border-radius:var(--radio-control);border:0;background:var(--nube);box-shadow:var(--sombra-control);color:var(--tinta);font-size:var(--t-apoyo);font-weight:500;line-height:20px;text-decoration:none;white-space:nowrap;user-select:none;transition:background 300ms var(--curva-control),box-shadow 300ms var(--curva-control),transform 140ms var(--salida)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--activo);color:var(--tinta-invertida);box-shadow:none}
.btn.primary:hover:not(:disabled){background:var(--activo-pulsado);box-shadow:var(--sombra-control-alta);color:var(--tinta-invertida)}
.btn.ghost{background:none;box-shadow:none;color:var(--tinta2);padding:0 var(--e3)}
.btn.ghost:hover:not(:disabled){background:var(--nube-hundida);color:var(--tinta)}
.btn:disabled{background:var(--nube-honda);color:var(--tinta3);box-shadow:none;cursor:default}
.btn.ghost:disabled{background:none}
/* el botón de icono del editor (.icono de EditorDePreguntas) */
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radio-control);background:transparent;color:var(--tinta2);transition:transform 140ms var(--salida)}
.icon-btn:hover:not(:disabled){background:var(--nube-hundida);color:var(--tinta)}
.icon-btn:active:not(:disabled){transform:scale(.94)}
.icon-btn:disabled{color:var(--regla2);cursor:default}

/* ---------- Armazón del panel (réplica de src/panel/Armazon.module.css) ---------- */
.armazon{min-height:100dvh;display:flex;flex-direction:column}
.barra{position:sticky;top:0;z-index:55;background:var(--nube);border-bottom:1px solid var(--regla)}
.barra::before{content:'';display:block;height:2px;background:var(--canto)}
.barraDentro{display:flex;align-items:center;gap:var(--e3) var(--e4);min-height:calc(var(--alto-barra) - 3px);padding:0 var(--e5);min-width:0}
.marcaEnlace{flex:none;display:inline-flex;align-items:center;gap:var(--e3);min-height:44px;color:var(--tinta);text-decoration:none}

.quienEs{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);border-left:1px solid var(--regla2);padding-left:var(--e3);white-space:nowrap}
.empresa{min-width:0;flex:0 1 auto;font-size:var(--t-apoyo);font-weight:600;color:var(--tinta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:var(--e4);border-left:1px solid var(--regla)}
.persona{margin-left:auto;flex:0 1 auto;display:flex;align-items:center;gap:var(--e3);min-width:0}
.nombre{min-width:0;max-width:16rem;font-size:var(--t-apoyo);color:var(--tinta2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.salir{flex:none;display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0 var(--e2);font-size:var(--t-apoyo);color:var(--tinta2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--regla2);text-underline-offset:.22em}
.salir:hover{color:var(--tinta)}
.botonMenu{display:none;flex:none;align-items:center;gap:var(--e2);min-height:44px;padding:0 var(--e3);border:1px solid var(--regla2);border-radius:var(--radio-control);background:var(--nube);color:var(--tinta);font-size:var(--t-apoyo);font-weight:600;cursor:pointer}
.botonMenu:hover{background:var(--nube-hundida)}
.cuerpo{flex:1;display:grid;grid-template-columns:var(--lat) minmax(0,1fr);transition:grid-template-columns 200ms var(--salida)}
.lateral{position:sticky;top:var(--alto-barra);align-self:start;height:calc(100dvh - var(--alto-barra));display:flex;flex-direction:column;gap:var(--e3);padding:var(--e4) var(--e3);background:var(--nube-hundida);border-right:1px solid var(--regla);z-index:10}
.principal{min-width:0}
.menu{flex:1;display:flex;flex-direction:column;gap:var(--e4);min-height:0}
.familias{display:flex;flex-direction:column;gap:var(--e4)}
.familia{display:flex;flex-direction:column;gap:var(--e1)}
.tituloFamilia{margin:0;padding:0 var(--e3);font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3)}
:root[data-plegado="true"] .lateral .tituloFamilia{margin:0 var(--e2);height:1px;overflow:hidden;background:var(--regla);color:transparent;padding:0}
.entradas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pie{margin-top:auto;padding-top:var(--e3);border-top:1px solid var(--regla)}
.enlace{position:relative;display:flex;align-items:center;gap:var(--e3);min-height:44px;padding:0 var(--e3);border-radius:var(--radio-control);color:var(--tinta2);font-size:var(--t-apoyo);text-decoration:none;transition:background 160ms var(--salida),color 160ms var(--salida)}
.enlace:hover{color:var(--tinta);background:var(--nube-honda)}
.enlace[aria-current="page"]{color:var(--tinta);font-weight:700;background:var(--nube);box-shadow:var(--sombra-control)}
.enlace[aria-current="page"]:hover{background:var(--nube)}
.icono{flex:none;display:inline-flex;width:20px;justify-content:center}
.texto{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plegar{display:flex;align-items:center;gap:var(--e3);min-height:44px;padding:0 var(--e3);border:0;border-radius:var(--radio-control);background:none;color:var(--tinta2);font-size:var(--t-apoyo);cursor:pointer;position:relative}
.plegar:hover{color:var(--tinta);background:var(--nube-honda)}
:root[data-plegado="true"] .plegar .icono{transform:rotate(180deg)}
:root[data-plegado="true"] .lateral .enlace,:root[data-plegado="true"] .plegar{justify-content:center;padding:0}
:root[data-plegado="true"] .lateral .texto{position:absolute;left:calc(100% + var(--e3));top:50%;transform:translateY(-50%);padding:var(--e1) var(--e3);border-radius:var(--radio-menor);background:var(--accion-fuerte);color:var(--tinta-invertida);font-size:var(--t-micro);font-weight:600;opacity:0;pointer-events:none;transition:opacity 120ms var(--salida);z-index:30}
:root[data-plegado="true"] .lateral .enlace:hover .texto,:root[data-plegado="true"] .lateral .enlace:focus-visible .texto,:root[data-plegado="true"] .lateral .plegar:hover .texto,:root[data-plegado="true"] .lateral .plegar:focus-visible .texto{opacity:1}
.velo{position:fixed;inset:0;z-index:60;background:var(--velo)}
.cajon{position:fixed;top:0;bottom:0;left:0;z-index:61;width:min(20rem,86vw);display:flex;flex-direction:column;gap:var(--e4);padding:var(--e4);background:var(--nube-hundida);box-shadow:var(--sombra-nube);overflow-y:auto;animation:entraElCajon 200ms var(--salida)}
@keyframes entraElCajon{from{transform:translateX(-100%)}to{transform:none}}
.cajon nav{flex:1;display:flex;flex-direction:column}
.cabeceraCajon{display:flex;align-items:center;justify-content:space-between}
.tituloCajon{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3)}
.cerrarCajon{width:44px;height:44px;border:0;border-radius:var(--radio-control);background:none;color:var(--tinta2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cerrarCajon:hover{background:var(--nube-honda);color:var(--tinta)}
@media (max-width:1023.98px){.cuerpo{grid-template-columns:minmax(0,1fr)}.lateral{display:none}.botonMenu{display:inline-flex}}
@media (max-width:640px){.barraDentro{padding:0 var(--e4);gap:var(--e2)}.quienEs,.empresa,.nombre{display:none}}
@media (prefers-reduced-motion: reduce){.cajon{animation:none}.cuerpo{transition:none}}

[hidden]{display:none!important}
/* ---------- Página del módulo: la .pagina de Vacantes y Colaboradores ---------- */
.modulo{max-width:var(--ancho-panel);margin:0 auto;padding:var(--e5) var(--e5) var(--e8)}
.modulo h1{margin-bottom:var(--e5)}
/* Pestañas: las de FichaColaborador */
.tabs{display:flex;gap:var(--e1);border-bottom:1px solid var(--regla2);overflow-x:auto;scrollbar-width:none;margin-bottom:var(--e5)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 var(--e4);border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--tinta2);font-size:var(--t-apoyo);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--tinta)}
.tab[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--tinta)}
.tab .cuenta{font-weight:400;color:var(--tinta3);margin-left:var(--e2);font-variant-numeric:tabular-nums}

/* ---------- Búsqueda: la línea tipo paleta (pieza nueva sobre el campo .entrada) ---------- */
.busqueda{display:flex;gap:var(--e3);align-items:flex-start;flex-wrap:wrap}
body.vacia .busqueda{display:none}
.line{flex:1 1 22rem;min-width:0;position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:var(--e2);min-height:44px;padding:3px var(--e1) 3px var(--e3);background:var(--nube);border:1px solid var(--borde-control);border-radius:var(--radio-control);cursor:text}
.line:focus-within{border-color:var(--activo);outline:3px solid color-mix(in srgb,var(--activo) 28%,transparent);outline-offset:2px}
.line > svg{color:var(--tinta3)}
/* Etiquetas: las de FiltrosDelRanking (.etiqueta + .aspa) a la altura del campo */
.tok{display:inline-flex;align-items:center;gap:var(--e1);min-height:34px;padding:0 var(--e1) 0 var(--e3);border:1px solid var(--regla2);border-radius:var(--radio-control);background:var(--nube-hundida);color:var(--tinta);font-size:var(--t-menor);white-space:nowrap;max-width:100%;transition:border-color 160ms var(--salida)}
.tok b{font-weight:400;color:var(--tinta2)}
.tok span{overflow:hidden;text-overflow:ellipsis}
.tok button{flex:none;border:0;background:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tinta2)}
.tok button:hover{background:var(--nube-honda);color:var(--tinta)}
.tok:hover{border-color:var(--tinta)}
.tok.armed{border-color:var(--tinta);border-width:2px;font-weight:700}
.line input{flex:1 1 140px;min-width:100px;border:0;outline:0;background:transparent;font-size:var(--t-base);min-height:36px;padding:0 var(--e1);color:var(--tinta)}
.line input::-webkit-search-cancel-button{display:none}
.line input::placeholder{color:var(--tinta3)}
.line kbd{margin-right:var(--e2)}
.filtrosWrap{position:relative;flex:none}
/* Botón de filtros: el secundario de piezas.module.css */
.fbtn .n{font-size:var(--t-micro);font-weight:700;background:var(--nube-honda);color:var(--tinta);border-radius:var(--radio-marca);padding:2px 6px;font-variant-numeric:tabular-nums}
@media (min-width:1440px){ body.hayDatos:not(.reading) .filtrosWrap{display:none} }
@media (max-width:640px){
  .line{flex-basis:100%}
  .line kbd{display:none}
}

/* ---------- Reparto: columna de filtros · lista · lectura ---------- */
.reparto{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--e5);align-items:start;margin-top:var(--e5)}
.colFiltros{display:none}
@media (min-width:1440px){
  body.hayDatos:not(.reading) .reparto{grid-template-columns:15rem minmax(0,1fr)}
  body.hayDatos:not(.reading) .colFiltros{display:block}
}
body[data-modo="lado"].reading .reparto{grid-template-columns:minmax(20rem,25rem) minmax(0,1fr)}
@media (min-width:1700px){ body[data-modo="lado"].reading .reparto{grid-template-columns:28rem minmax(0,1fr)} }
.listaCol{container:lista / inline-size;display:flex;flex-direction:column;gap:var(--e4);min-width:0}

/* Columna de filtros: grupos plegables con casillas (.casilla de Colaboradores) */
.colFiltros{position:sticky;top:calc(var(--alto-barra) + var(--e4))}
.colFiltros .cab{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.colFiltros h2{font-size:var(--t-apoyo);font-weight:600}
.grupoF{border-top:1px solid var(--regla)}
.grupoF summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:var(--t-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);cursor:pointer}
.grupoF summary::-webkit-details-marker{display:none}
.grupoF summary svg{transition:transform 160ms var(--salida)}
.grupoF:not([open]) summary svg{transform:rotate(-90deg)}
.grupoF .opciones{padding-bottom:var(--e2)}
.casilla{display:flex;align-items:center;gap:var(--e2);min-height:40px;font-size:var(--t-apoyo);color:var(--tinta);cursor:pointer}
.casilla input{margin:0;width:16px;height:16px;accent-color:var(--activo)}
.casilla .cuenta{margin-left:auto;color:var(--tinta3);font-variant-numeric:tabular-nums}

/* ---------- Lista: la tabla de Tabla.module.css, con filas que se vuelven tarjeta en lo estrecho ---------- */
.envoltura{background:var(--nube);border:1px solid var(--regla);border-radius:var(--radio);box-shadow:var(--sombra-nube);overflow:hidden}
.gh{display:flex;align-items:center;gap:var(--e2);padding:var(--e3) var(--e4);background:var(--nube-hundida);border-bottom:1px solid var(--regla2);font-size:var(--t-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.tabla{display:block;width:100%;border-collapse:collapse;font-size:var(--t-apoyo)}
.tabla thead,.tabla tbody{display:block}
.tabla thead{display:none}
.tabla tr{display:grid;column-gap:var(--e4);row-gap:var(--e1);padding:var(--e3) var(--e4);align-items:start}
.tabla th{text-align:left;font-size:var(--t-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);white-space:nowrap}
.tabla thead tr{background:var(--nube-hundida);border-bottom:1px solid var(--regla2)}
.tabla tr.grupo{display:block;background:var(--nube-hundida);border-bottom:1px solid var(--regla2)}
.tabla tbody + tbody tr.grupo{border-top:1px solid var(--regla2)}
.tabla tr.grupo th span{margin-left:var(--e2);font-variant-numeric:tabular-nums}
.tabla td{display:block;min-width:0}
.fila{grid-template-columns:minmax(0,1fr);grid-template-areas:"vac" "meta" "est" "res" "acc";border-bottom:1px solid var(--regla);cursor:pointer}
.tabla tbody tr.fila:last-child{border-bottom:0}
@media (hover:hover) and (pointer:fine){.fila:hover{background:var(--nube-hundida)}}
.fila:focus-within{background:var(--nube-hundida)}
.fila:has(.ver:focus-visible){outline:2px solid var(--activo);outline-offset:-2px}
.fila.abierta{background:var(--nube-hundida);box-shadow:inset 3px 0 0 var(--activo-regla)}
.c-vac{grid-area:vac}.c-niv{grid-area:niv}.c-sit{grid-area:sit}.c-est{grid-area:est}.c-res{grid-area:res}.c-ver{grid-area:ver}.c-meta{grid-area:meta}.c-acc{grid-area:acc}
.c-niv,.c-sit,.c-ver{display:none!important}
.ver{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;padding:0;border:0;background:none;text-align:left;font-size:var(--t-prosa);font-weight:600;line-height:1.35;color:var(--tinta);overflow-wrap:anywhere;cursor:pointer}
.ver:focus-visible{outline:none}
.sede{font-weight:400;color:var(--tinta2)}
.datos{display:flex;flex-wrap:wrap;column-gap:var(--e4);margin-left:calc(-1 * var(--e4));padding-left:var(--e4);clip-path:inset(0 0 0 var(--e4));font-size:var(--t-apoyo);color:var(--tinta2)}
.dato{white-space:nowrap;position:relative}
.dato::before{content:"·";position:absolute;left:calc(-1 * var(--e4) / 2 - 2px);color:var(--tinta3)}
.c-res{color:var(--tinta2)}
.c-ver{color:var(--tinta2);white-space:nowrap}
.c-est{display:flex;flex-direction:column;align-items:flex-start;gap:var(--e1)}
.c-acc{display:flex;flex-wrap:wrap;gap:var(--e2);padding-top:var(--e1)}
body[data-modo="lado"].reading .c-acc{display:none}
.solo-mid{display:none}
/* Botón «chico» de Colaboradores */
.chico{display:inline-flex;align-items:center;justify-content:center;gap:var(--e2);min-height:40px;padding:0 var(--e3);border:1px solid var(--regla2);border-radius:var(--radio-control);background:var(--nube);color:var(--tinta);font-size:var(--t-apoyo);text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform 140ms var(--salida)}
.chico:hover{background:var(--nube-hundida);color:var(--tinta)}
.chico:active{transform:scale(.97)}
@container lista (min-width:860px){
  .tabla thead{display:block}
  .tabla tr:not(.grupo){grid-template-columns:minmax(0,2fr) minmax(7rem,.9fr) minmax(11.5rem,1.3fr) minmax(10rem,1.3fr) auto;grid-template-areas:"vac niv est res acc" "vac sit est ver acc"}
  .tabla thead tr:not(.grupo){grid-template-areas:"vac niv est res acc"}
  .c-niv,.c-ver{display:block!important}
  td.c-sit{display:block!important}
  .c-meta{display:none!important}
  .tabla th.c-ver,.tabla th.c-sit,.tabla th.c-meta{display:none!important}
  .solo-mid{display:inline}
  .c-acc{padding-top:0;justify-content:flex-end;flex-wrap:nowrap}
  .chico .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .chico.soloIcono{width:40px;padding:0}
}
@container lista (min-width:1100px){
  .tabla tr:not(.grupo),.tabla thead tr:not(.grupo){grid-template-columns:minmax(0,2.4fr) minmax(6.5rem,.8fr) minmax(7rem,.9fr) minmax(10rem,1.3fr) minmax(11rem,1.4fr) 7.5rem auto;grid-template-areas:"vac niv sit est res ver acc"}
  .tabla th.c-ver,.tabla th.c-sit{display:block!important}
  .solo-mid{display:none}
}
/* Marcas de estado: las de colaboradores/piezas.module.css */
.chips{display:flex;flex-wrap:wrap;gap:var(--e2);align-items:center}
.chip{display:inline-flex;align-items:center;gap:var(--e1);padding:2px var(--e3);border-radius:var(--radio-control);font-size:var(--t-micro);font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.chip.pub{background:var(--bien-bruma);color:var(--bien)}
.chip.bor{background:var(--nube);color:var(--tinta2);border-color:var(--regla2)}
.chip.rinde{background:var(--duda-bruma);color:var(--duda-tinta)}
.chip.open{padding:0;border:0;background:none;color:var(--duda-tinta)}
.chip.open::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.att{background:var(--nube);color:var(--tinta2);border-color:var(--regla2);font-weight:600}
/* Sugerencias de filtro */
.sugs .lista{display:flex;flex-direction:column}
.sug{display:flex;align-items:center;gap:var(--e3);width:100%;min-height:44px;padding:0 var(--e4);border:0;border-bottom:1px solid var(--regla);background:none;text-align:left;font-size:var(--t-apoyo);color:var(--tinta);cursor:pointer}
.sug:last-child{border-bottom:0}
.sug:hover,.sug:focus-visible{background:var(--nube-hundida)}
.sug:focus-visible{outline:2px solid var(--activo);outline-offset:-2px}
.sug .plus{width:24px;height:24px;border-radius:var(--radio-marca);display:inline-flex;align-items:center;justify-content:center;background:var(--nube-hundida);border:1px solid var(--regla2);color:var(--tinta2)}
.sug b{font-weight:400;color:var(--tinta2)}

/* ---------- Estados: el .marco de ui/Estados.module.css y el .aviso.malo de Vacantes ---------- */
.marco{max-width:44rem;border:1px solid var(--regla);padding:var(--e6);border-radius:var(--radio);background:var(--nube)}
.marco .hormiga{display:block;margin-bottom:var(--e4)}
.marco .hormiga .marca{color:var(--regla2)}
.tituloVacio{display:block;font-size:var(--t-entradilla);font-weight:600;letter-spacing:-.014em}
.marco .texto{font-size:var(--t-prosa);line-height:1.6;color:var(--tinta2);margin-top:var(--e3);max-width:var(--medida)}
.marco .botones{display:flex;flex-wrap:wrap;gap:var(--e4);margin-top:var(--e5)}
.marco.estrecho{padding:var(--e4) var(--e5)}
.aviso.malo{display:flex;align-items:center;flex-wrap:wrap;gap:var(--e3);margin-top:var(--e4);border:1px solid var(--mal-regla);background:var(--mal-bruma);padding:var(--e3) var(--e4);color:var(--mal);font-size:var(--t-prosa);border-radius:var(--radio-menor)}
.aviso.malo::before{content:"";align-self:stretch;flex:none;width:3px;background:var(--mal)}
.aviso.malo .btn{margin-left:auto}
.carga{padding:var(--e3) var(--e4);border-bottom:1px solid var(--regla)}
.carga:last-child{border-bottom:0}
.barra-c{height:12px;background:var(--nube-honda);margin-top:var(--e3);border-radius:var(--radio-control)}
.barra-c:first-child{margin-top:0}
.barraLarga{width:72%}.barraCorta{width:44%}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .55s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.marco{padding:var(--e5)}.marco .botones .btn{width:100%}}

/* ---------- Popover de filtros (pieza nueva): superficie de aviso y chips de FiltrosDelRanking ---------- */
.pop{position:absolute;z-index:30;top:calc(100% + var(--e2));right:0;width:360px;max-width:calc(100vw - 32px);background:var(--nube);border:1px solid var(--regla);border-radius:var(--radio);box-shadow:var(--sombra-aviso);padding:var(--e4);transform-origin:top right;opacity:0;transform:scale(.96);visibility:hidden;transition:opacity 160ms var(--salida),transform 160ms var(--salida),visibility 0s 160ms;cursor:default}
.pop.open{opacity:1;transform:none;visibility:visible;transition:opacity 180ms var(--salida),transform 180ms var(--salida)}
.grupoP + .grupoP{margin-top:var(--e4)}
.grupoP h3{font-size:var(--t-micro);font-weight:600;color:var(--tinta2);margin-bottom:var(--e2)}
.grupoP .opts{display:flex;flex-wrap:wrap;gap:var(--e2)}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--e3);font-size:var(--t-menor);border:1px solid var(--regla2);border-radius:var(--radio-control);background:var(--nube);color:var(--tinta2);white-space:nowrap;transition:border-color 160ms var(--salida),transform 120ms var(--salida)}
.pill:hover{border-color:var(--tinta2);color:var(--tinta)}
.pill:active{transform:scale(.97)}
.pill[aria-pressed="true"]{border-color:var(--tinta);border-width:2px;color:var(--tinta);font-weight:700;padding:0 11px}
.pop .foot{display:flex;justify-content:space-between;align-items:center;gap:var(--e3);margin-top:var(--e4);padding-top:var(--e3);border-top:1px solid var(--regla)}
.pop .handle{display:none}
.pop-scrim{display:none}
@media (max-width:640px){
  .pop{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;border-radius:var(--radio) var(--radio) 0 0;border-width:1px 0 0;padding:var(--e2) var(--e4) calc(var(--e4) + env(safe-area-inset-bottom));transform:translateY(100%);opacity:1;transition:transform 200ms var(--salida),visibility 0s 200ms;z-index:62}
  .pop.open{transform:none;transition:transform 300ms var(--ease-drawer)}
  .pop .handle{display:block;width:36px;height:4px;border-radius:var(--radio-marca);background:var(--regla2);margin:var(--e1) auto var(--e3)}
  .pop-scrim{display:block;position:fixed;inset:0;z-index:61;background:var(--velo);opacity:0;visibility:hidden;transition:opacity 200ms ease,visibility 0s 200ms}
  .pop-scrim.open{opacity:1;visibility:visible;transition:opacity 300ms ease}
}

/* ---------- Lectura: panel al lado (≥1280), hoja desde abajo (641–1279), pantalla completa (≤640) ---------- */
#lectura{display:none;flex-direction:column;container:lectura / inline-size;background:var(--nube);outline:none;min-width:0}
body[data-modo="lado"].reading #lectura{display:flex;position:sticky;top:calc(var(--alto-barra) + var(--e4));height:calc(100dvh - var(--alto-barra) - 2 * var(--e4));border:1px solid var(--regla);border-radius:var(--radio);box-shadow:var(--sombra-nube);overflow:hidden}
body[data-modo="hoja"] #lectura,body[data-modo="completa"] #lectura{display:flex;position:fixed;z-index:51;left:calc(var(--lat) + var(--e5));right:var(--e5);top:calc(var(--alto-barra) + var(--e4));bottom:0;border:1px solid var(--regla);border-bottom:0;border-radius:var(--radio) var(--radio) 0 0;box-shadow:var(--sombra-aviso);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform 200ms var(--salida),visibility 0s 200ms}
body[data-modo="completa"] #lectura{left:0;right:0;top:0;border:0;border-radius:0;z-index:70}
body.reading[data-modo="hoja"] #lectura,body.reading[data-modo="completa"] #lectura{transform:none;visibility:visible;transition:transform 340ms var(--ease-drawer)}
body.instant #lectura,body.instant .scrim{transition:none!important}
#lectura.dragging{transition:none!important}
.scrim{position:fixed;top:var(--alto-barra);left:var(--lat);right:0;bottom:0;z-index:50;background:var(--velo);opacity:0;visibility:hidden;transition:opacity 200ms ease-out,visibility 0s 200ms}
body.reading[data-modo="hoja"] .scrim{opacity:1;visibility:visible;transition:opacity 320ms var(--ease-drawer)}
body.reading[data-modo="hoja"],body.reading[data-modo="completa"]{overflow:hidden}
.sh-head{flex:none;padding:var(--e2) var(--e5);border-bottom:1px solid var(--regla);touch-action:none}
.sh-head .handle{width:36px;height:4px;border-radius:var(--radio-marca);background:var(--regla2);margin:0 auto var(--e1);cursor:grab}
body[data-modo="lado"] .sh-head{touch-action:auto}
body[data-modo="lado"] .sh-head .handle,body[data-modo="lado"] .pager{display:none}
.sh-bar{display:flex;align-items:center;gap:var(--e2);justify-content:space-between}
.pager{display:flex;align-items:center;gap:var(--e1);color:var(--tinta2);font-size:var(--t-apoyo)}
.pager .num{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.sh-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 var(--e5) var(--e8)}
.eyebrow{margin:var(--e5) 0 var(--e2);font-size:var(--t-apoyo);color:var(--tinta2)}
.sh-title{font-size:var(--t-destacado);font-weight:700;letter-spacing:-.03em;line-height:1.2;color:var(--tinta);text-wrap:balance;outline:none;overflow-wrap:anywhere}
.sh-title .sede{font-size:var(--t-entradilla);letter-spacing:-.01em;font-weight:400}
.sh-sub{display:flex;flex-wrap:wrap;gap:var(--e2) var(--e4);align-items:center;margin:var(--e3) 0 var(--e4);font-size:var(--t-apoyo);color:var(--tinta2)}
.sh-actions{display:flex;flex-wrap:wrap;gap:var(--e3);padding-bottom:var(--e5)}
.draft-note{margin:0 0 var(--e2);padding:var(--e2) var(--e3);border-radius:var(--radio-control);background:var(--duda-bruma);color:var(--duda-tinta);font-size:var(--t-apoyo);font-weight:600}
.blk{margin-top:var(--e5)}
.blk > h3{margin:0 0 var(--e3);font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3)}
.caso{font-size:var(--t-prosa);line-height:1.6;color:var(--tinta2);max-width:72ch}
.crits{display:flex;flex-direction:column;gap:var(--e3)}
.crit{border:1px solid var(--regla);border-radius:var(--radio-control);padding:var(--e4) var(--e5);display:flex;flex-direction:column;gap:var(--e3);min-width:0}
.crit h4{display:flex;align-items:baseline;gap:var(--e3);font-size:var(--t-entradilla);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.crit h4 .num{font-size:var(--t-apoyo);color:var(--tinta3);font-weight:400;font-variant-numeric:tabular-nums}
.crit ol{display:flex;flex-direction:column;gap:var(--e2)}
.crit li{counter-increment:q;position:relative;background:var(--nube-hundida);border-radius:var(--radio-control);padding:var(--e3) var(--e4) var(--e3) 44px;font-size:var(--t-prosa);line-height:1.5}
.crit li::before{content:counter(q);position:absolute;left:var(--e4);top:var(--e3);font-size:var(--t-apoyo);font-weight:600;color:var(--tinta3);font-variant-numeric:tabular-nums}
.crit li .att{margin-left:var(--e2);vertical-align:1px}
.crit .none{color:var(--tinta2);font-size:var(--t-apoyo)}
.ent{border:1px solid var(--regla);border-radius:var(--radio-control)}
.ent li{display:flex;gap:var(--e3);align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:var(--e3) var(--e4);border-bottom:1px solid var(--regla);font-size:var(--t-prosa)}
.ent li:last-child{border-bottom:0}
.ent li .fmt{font-size:var(--t-apoyo);color:var(--tinta2)}
.lectura-carga{margin-top:var(--e5)}
.lectura-carga .barra-c{height:14px}
@container lectura (min-width:52rem){
  .crits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .dests{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .sh-head{padding:var(--e2) var(--e4)}
  .sh-body{padding:0 var(--e4) var(--e6)}
  .sh-actions .btn{flex:1 1 auto}
  .kbd-esc{display:none}
  .crit{padding:var(--e4)}
}

/* ---------- Copia en línea (pieza nueva): la .confirmacion del editor con las opciones de nivel de Vacantes ---------- */
.copy{display:grid;grid-template-rows:0fr;transition:grid-template-rows 200ms var(--salida)}
.copy.open{grid-template-rows:1fr;transition:grid-template-rows 260ms var(--salida)}
.copy > div{overflow:hidden;min-height:0}
.copy-in{margin:0 0 var(--e5);padding:var(--e4);border-radius:var(--radio-control);background:var(--nube-hundida)}
.copy-head{display:flex;align-items:center;justify-content:space-between;gap:var(--e3);margin-bottom:var(--e2)}
.copy-head label{font-size:var(--t-apoyo);font-weight:600}
.copy input[type=search]{width:100%;min-height:44px;padding:0 var(--e3);border:1px solid var(--borde-control);border-radius:var(--radio-menor);background:var(--nube);font-size:var(--t-base);color:var(--tinta)}
.copy input[type=search]:focus-visible{outline:3px solid color-mix(in srgb,var(--activo) 28%,transparent);outline-offset:2px;border-color:var(--activo)}
.dests{margin-top:var(--e3);max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:var(--e2);padding:2px}
.dest{flex:none;display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px var(--e2);align-items:center;min-height:44px;padding:var(--e2) var(--e3);border:1px solid var(--borde-control);border-radius:var(--radio-menor);background:var(--nube);cursor:pointer;font-size:var(--t-apoyo)}
.dest input{margin:0;accent-color:var(--activo);width:16px;height:16px}
.dest .dt{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dest .dm,.dest .why{grid-column:2;font-size:var(--t-menor)}
.dest .dm{color:var(--tinta2)}
.dest .why{color:var(--mal)}
.dest.on{border-color:var(--activo);background:var(--activo-bruma)}
.dest:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--activo) 28%,transparent);outline-offset:2px}
.dest.off{cursor:default;background:var(--nube-hundida);border:1px dashed var(--borde-control)}
.dest.off .dt,.dest.off .sede{color:var(--tinta2);font-weight:400}
.copy-act{display:flex;align-items:center;gap:var(--e3);flex-wrap:wrap;margin-top:var(--e3)}
.copy-act .msg{flex:1 1 240px;font-size:var(--t-apoyo);line-height:1.5}
.copy-act .msg:empty{display:none}
.copy-act .msg.warn{padding:var(--e2) var(--e3);border-radius:var(--radio-control);background:var(--duda-bruma);color:var(--duda-tinta);font-weight:600}
.copy-act .msg.bad{padding:var(--e3) var(--e4);border-radius:var(--radio-menor);background:var(--mal-bruma);color:var(--mal)}
.copy-act .btns{display:flex;gap:var(--e3);margin-left:auto;flex-wrap:wrap}
.lbl{display:inline-flex;align-items:center;gap:var(--e2);transition:filter 200ms ease,opacity 200ms ease}
.lbl.blur{filter:blur(2px);opacity:.6}
@media (max-width:640px){
  .dests{max-height:none;overflow:visible}
  .copy > div{overflow:visible}
  .copy:not(.open) > div{overflow:hidden}
  .copy-act{position:sticky;bottom:0;margin:var(--e3) calc(-1 * var(--e4)) calc(-1 * var(--e4));padding:var(--e3) var(--e4);background:var(--nube-hundida);border-top:1px solid var(--regla)}
}

/* ---------- Aviso flotante: el .aviso de ui/Avisos.module.css ---------- */
.toasts{position:fixed;z-index:110;right:var(--e5);bottom:var(--e5);max-width:min(24rem,calc(100vw - 2 * var(--e5)));pointer-events:none}
.toast{pointer-events:auto;background:var(--tinta);color:var(--nube);padding:var(--e3) var(--e4);font-size:var(--t-apoyo);font-weight:600;line-height:1.4;opacity:1;transform:none;transition:opacity 180ms var(--salida),transform 180ms var(--salida)}
@starting-style{.toast{opacity:0;transform:translateY(8px)}}
.toast.out{opacity:0;transform:translateY(8px)}
@media (max-width:640px){.toasts{right:var(--e4);left:var(--e4);bottom:var(--e4);max-width:none}}

/* ---------- Teléfono: pestañas iguales ---------- */
@media (max-width:640px){
  .modulo{padding:var(--e4) var(--e4) var(--e7)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .tab{white-space:normal;text-align:center;line-height:1.25;padding:var(--e2)}
  .tab .cuenta{margin-left:var(--e1)}
}

/* ---------- Conmutador de demo (fuera del diseño) ---------- */
.demo{position:fixed;z-index:120;right:12px;bottom:12px;font:12px/1.4 ui-monospace,monospace;color:#ddd}
.demo summary{list-style:none;cursor:pointer;background:#2a2a2e;border-radius:8px;padding:7px 10px;border:1px dashed #777}
.demo summary::-webkit-details-marker{display:none}
.demo .box{position:absolute;right:0;bottom:calc(100% + 6px);width:250px;max-height:70vh;overflow:auto;background:#2a2a2e;border:1px dashed #777;border-radius:10px;padding:10px 12px}
.demo label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.demo hr{border:0;border-top:1px solid #444;margin:8px 0}
.demo b{color:#fff;font-weight:500}
body.pop-abierto .demo,body.reading[data-modo="completa"] .demo{display:none}
@media (max-width:640px){.demo{right:8px;bottom:8px}.demo summary{padding:5px 8px}.demo .long{display:none}}

@media (prefers-reduced-motion: reduce){
  body[data-modo="hoja"] #lectura,body[data-modo="completa"] #lectura{transform:none;opacity:0;transition:opacity 150ms ease,visibility 0s 150ms}
  body.reading[data-modo="hoja"] #lectura,body.reading[data-modo="completa"] #lectura{opacity:1;transition:opacity 150ms ease}
  .pop,.pop.open{transform:none!important}
  .toast,.toast.out{transform:none!important}
  @starting-style{.toast{transform:none}}
  .btn:active,.pill:active,.chico:active,.icon-btn:active{transform:none!important}
  .spin{animation-duration:1.5s}
  .copy,.copy.open,.grupoF summary svg{transition:none}
}
</style>

const norm = s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const fecha = iso=>{const [y,m,d]=iso.split('-');return `${+d} ${MESES[+m-1]} ${y}`};

function tiempo(t){ if(!t) return ''; if(t.min) return `${t.min} min`; if(t.dias) return plural(t.dias,'día','días'); return 'Sin cronómetro'; }
function counts(r){ const c=r.crit.length, p=r.crit.reduce((a,x)=>a+x.p.length,0); return {c,p,e:(r.ent||[]).length}; }
function resumen(r,tipo){ const k=counts(r); const seg=[plural(k.c,'criterio','criterios'),plural(k.p,'pregunta','preguntas')]; if(tipo==='prueba') seg.push(plural(k.e,'entregable','entregables'),tiempo(r.t)); return seg.map(x=>`<span style="white-space:nowrap">${x}</span>`).join(' · '); }

/* ============ Estado (vive en la URL) ============ */
const S = {
  tipo:'preguntas', q:'', f:{nivel:[],estado:[],situacion:[]},
  armed:false, open:null, prevEstado:'ok',
  demo:'normal', reintentando:false, prev:'normal', puedeEditar:true, copiaFalla:false, carrera:false,
  copy:null, eliminadas:new Set(),
};
function readURL(){
  const u=new URLSearchParams(location.search);
  if(u.get('tipo')==='prueba') S.tipo='prueba';
  S.q=u.get('buscar')||'';
  for(const k in S.f){ const v=u.get(k); S.f[k]=v?v.split(',').filter(x=>FACETS[k].values.includes(x)):[]; }
  S.open=u.get('vacante')||null;
}
function writeURL(){
  const u=new URLSearchParams(); u.set('tipo',S.tipo);
  if(S.q) u.set('buscar',S.q);
  for(const k in S.f) if(S.f[k].length) u.set(k,S.f[k].join(','));
  if(S.open) u.set('vacante',S.open);
  try{ history.replaceState(null,'','?'+u.toString()); }catch(e){}
}
function rowsFor(tipo){ return S.demo==='vacio'?[]:DATA[tipo].filter(r=>!S.eliminadas.has(r.v)); }
function textForTitle(){ return /^(nivel|estado|situacion|vacante)\s*:/i.test(norm(S.q))?'':S.q; }
function matches(r){
  const v=VAC[r.v], q=norm(textForTitle());
  if(q && !norm(v.t).includes(q)) return false;           // la spec: se busca por título
  if(S.f.nivel.length && !(v.nivel && S.f.nivel.includes(v.nivel))) return false;
  if(S.f.situacion.length && !S.f.situacion.includes(v.sit)) return false;
  if(S.f.estado.length){
    const ok=S.f.estado.some(e=> e==='Borrador'?r.estado==='BORRADOR': e==='Publicada'?r.estado==='PUBLICADA': r.rinde);
    if(!ok) return false;
  }
  return true;
}
function sorted(list){
  return [...list].sort((a,b)=>{
    if(a.pub&&b.pub) return b.pub.localeCompare(a.pub);
    if(a.pub) return -1; if(b.pub) return 1;
    return VAC[a.v].t.localeCompare(VAC[b.v].t);
  });
}
function visible(){ return sorted(rowsFor(S.tipo).filter(matches)); }
function activeFilters(){ const out=[]; for(const k in S.f) for(const v of S.f[k]) out.push([k,v]); return out; }
function suggestions(){
  let q=norm(S.q); if(q.length<2) return [];
  let only=null;
  const m=q.match(/^(nivel|estado|situacion|vacante)\s*:\s*(.*)$/);
  if(m){ only = m[1]==='vacante'?'situacion':m[1]; q=m[2]; }
  const out=[];
  for(const k in FACETS){
    if(only && k!==only) continue;
    for(const v of FACETS[k].values){
      if(S.f[k].includes(v)) continue;
      const nv=norm(v), nl=norm(FACETS[k].label+' '+v);
      if(only ? (q===''||nv.includes(q)) : (nv.startsWith(q)||nv.split(' ').some(w=>w.startsWith(q))||nl.startsWith(q))) out.push([k,v]);
    }
  }
  return out.slice(0,5);
}
const mqLado=matchMedia('(min-width: 1280px)'), mqTel=matchMedia('(max-width: 640px)');

function renderTabs(){
  $('#tabs').innerHTML = Object.keys(TIPOS).map(k=>{
    const n = S.demo==='cargando'?'…':rowsFor(k).length;
    return `<button class="tab" role="tab" id="tab-${k}" aria-selected="${S.tipo===k}" aria-controls="panel" tabindex="${S.tipo===k?0:-1}" data-tipo="${k}">${TIPOS[k]}<span class="cuenta">${n}</span></button>`;
  }).join('');
  $('#panel').setAttribute('aria-labelledby','tab-'+S.tipo);
}
function tokenUnits(){
  const af=activeFilters();
  if(af.length<6) return af.map(([k,v])=>({k,vals:[v]}));
  return Object.keys(S.f).filter(k=>S.f[k].length).map(k=>({k,vals:[...S.f[k]]}));
}
function renderBusqueda(){
  const vacia = S.demo!=='cargando' && !rowsFor(S.tipo).length;
  document.body.classList.toggle('vacia',vacia);
  document.body.classList.toggle('hayDatos',!vacia);
  const units=tokenUnits();
  $('#toks').innerHTML = units.map((u,i)=>`<span class="tok${S.armed&&i===units.length-1?' armed':''}"><b>${FACETS[u.k].label}</b>&nbsp;<span>${esc(u.vals.join(', '))}</span><button type="button" data-rm="${u.k}|${esc(u.vals.join('|'))}" aria-label="Quitar ${FACETS[u.k].label}: ${esc(u.vals.join(', '))}">${icon.x}</button></span>`).join('');
  const n=activeFilters().length;
  $('#q').placeholder = mqTel.matches||units.length ? 'Buscar…' : 'Buscar vacante, nivel, estado…';
  $('#fbtn').innerHTML = mqTel.matches ? `${icon.filtros}Filtrar${n?` (${n})`:''}` : `${icon.filtros}Filtros${n?`<span class="n">${n}</span>`:''}`;
  $('#fbtn').setAttribute('aria-label', n?`Filtros, ${n} activos`:'Filtros');
  $('#quitar').hidden=!n;
}
function grupos(estilo){
  const base=rowsFor(S.tipo);
  const cuenta=(k,v)=>base.filter(r=>{ const x=VAC[r.v]; return k==='nivel'?x.nivel===v : k==='situacion'?x.sit===v : v==='Borrador'?r.estado==='BORRADOR': v==='Publicada'?r.estado==='PUBLICADA': r.rinde; }).length;
  return Object.keys(FACETS).map(k=>{
    const id=`g-${estilo}-${k}`;
    if(estilo==='pop') return `<div class="grupoP" role="group" aria-labelledby="${id}"><h3 id="${id}">${FACETS[k].legend}</h3><div class="opts">${FACETS[k].values.map(v=>`<button type="button" class="pill" aria-pressed="${S.f[k].includes(v)}" data-f="${k}|${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`;
    return `<details class="grupoF" open><summary>${FACETS[k].legend}${icon.chev}</summary><div class="opciones" role="group" aria-label="${FACETS[k].legend}">${FACETS[k].values.map(v=>`<label class="casilla"><input type="checkbox" data-f="${k}|${esc(v)}" ${S.f[k].includes(v)?'checked':''}>${esc(v)}<span class="cuenta">${cuenta(k,v)}</span></label>`).join('')}</div></details>`;
  }).join('');
}
function renderFiltros(){
  $('#popBody').innerHTML=grupos('pop');
  $('#popClear').disabled=!activeFilters().length;
  const abiertos=$$('#colFiltros details').map(d=>d.open);

  $$('#colFiltros details').forEach((d,i)=>{ if(abiertos.length) d.open=abiertos[i]; });
}

function renderResults(){
  const box=$('#results'), sb=$('#sugs'), live=$('#live');

    ? `<div class="aviso malo" role="alert"><span>No se pudo actualizar la lista.</span><button class="btn" id="retry" ${S.reintentando?'disabled':''}>${S.reintentando?'<span class="spin" aria-hidden="true"></span>Reintentando…':'Reintentar'}</button></div>` : '';
  if(S.demo==='cargando'){
    sb.innerHTML=''; box.setAttribute('aria-busy','true');
    box.innerHTML=`<div class="envoltura"><div class="gh"><span class="spin" aria-hidden="true"></span>Buscando…</div>${'<div class="carga"><div class="barra-c barraLarga"></div><div class="barra-c barraCorta"></div></div>'.repeat(4)}</div>`;
    live.textContent='Buscando…'; return;
  }
  box.removeAttribute('aria-busy');
  if(!rowsFor(S.tipo).length){
    sb.innerHTML='';
    const t = S.tipo==='preguntas'?'Ninguna vacante tiene preguntas propias todavía':'Ninguna vacante tiene prueba del puesto todavía';
    box.innerHTML=`<div class="marco"><span class="hormiga" aria-hidden="true"><span class="marca"></span></span><h2 class="tituloVacio">${t}</h2><p class="texto">${S.tipo==='preguntas'?'Las preguntas del Perfil Integral se escriben dentro de cada vacante.':'La prueba del puesto se escribe dentro de cada vacante.'}</p><div class="botones"><a class="btn primary" href="#vacantes" id="irVacantes">Ir a Vacantes</a></div></div>`;
    live.textContent=t; return;
  }
  const sugs=suggestions(), rows=visible();

  if(!rows.length){

      : (textForTitle()?`<div class="marco estrecho"><p class="texto" style="margin:0">Ningún título dice «${esc(S.q)}».</p></div>`:'');
  } else {
    const pubs=rows.filter(r=>r.pub), drafts=rows.filter(r=>!r.pub);
    const grupo=(t,list)=>list.length?`<tbody role="rowgroup"><tr class="grupo" role="row"><th colspan="8" role="columnheader" scope="colgroup">${t}<span>${list.length}</span></th></tr>${list.map(fila).join('')}</tbody>`:'';
    box.innerHTML=`<div class="envoltura"><table class="tabla" role="table" aria-label="${TIPOS[S.tipo]}"><thead role="rowgroup"><tr role="row"><th class="c-vac" role="columnheader">Vacante</th><th class="c-niv" role="columnheader">Nivel<span class="solo-mid"> y situación</span></th><th class="c-sit" role="columnheader">Situación</th><th class="c-est" role="columnheader">Estado</th><th class="c-res" role="columnheader">Resumen<span class="solo-mid"> y versión</span></th><th class="c-ver" role="columnheader">Versión</th><th class="c-meta" role="columnheader">Datos</th><th class="c-acc" role="columnheader">Acciones</th></tr></thead>${grupo('Publicadas',pubs)}${grupo('Borradores sin publicar',drafts)}</table></div>`;
  }
  live.textContent = `${rows.length} ${rows.length===1?'vacante':'vacantes'}`;
}
function renderAll(){ renderTabs(); renderBusqueda(); renderFiltros(); renderResults(); writeURL(); }

/* ============ Filtros ============ */
function toggleFilter(k,v){ const a=S.f[k]; const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); S.armed=false; renderAll(); }
function quitarFiltros(){ for(const k in S.f) S.f[k]=[]; S.armed=false; renderAll(); }
function clearAll(){ quitarFiltros(); S.q=''; $('#q').value=''; renderAll(); }
function aplicarSug(k,v){ if(!S.f[k].includes(v)) S.f[k].push(v); S.q=''; $('#q').value=''; renderAll(); $('#q').focus(); }

/* ============ Lectura: al lado, hoja o pantalla completa ============ */
let lastFocus=null;
const MODAL_FUERA=['#barra','#lateral','#demo','#cabeceraModulo','#colFiltros','#listaCol'];
function aplicarModal(){
  const m=modo(), modal=!!S.open && m!=='lado', L=$('#lectura');
  MODAL_FUERA.forEach(s=>{ const el=$(s); if(el) el.inert=modal; });
  if(modal){ L.setAttribute('role','dialog'); L.setAttribute('aria-modal','true'); }
  else { L.setAttribute('role','region'); L.removeAttribute('aria-modal'); }
}
function aplicarModo(){ document.body.dataset.modo=modo(); aplicarModal(); renderBusqueda(); if(S.open) renderLectura(); }
function current(){ return S.eliminadas.has(S.open)?null:DATA[S.tipo].find(r=>r.v===S.open); }
function marcarAbierta(){
  $$('#results .fila').forEach(tr=>{ const on=tr.dataset.v===S.open; tr.classList.toggle('abierta',on); tr.querySelector('.ver').setAttribute('aria-expanded',on); });
}
function verDe(v){ return $(`#results .ver[data-ver="${v}"]`); }
function abrir(v, viaTeclado, desdeLista){
  const ya=!!S.open, m=modo();
  if(!ya) lastFocus=document.activeElement;
  S.open=v; S.copy=null;
  S.prevEstado = !VAC[v]||!DATA[S.tipo].some(r=>r.v===v) ? 'eliminada' : S.prev==='cargando'?'cargando': S.prev==='falla'?'error': S.prev==='eliminada'?'eliminada':'ok';
  writeURL();
  if(viaTeclado && !ya && m!=='lado'){ document.body.classList.add('instant'); requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('instant'))); }
  document.body.classList.add('reading');
  aplicarModal(); renderLectura(); marcarAbierta();
  $('#shBody').scrollTop=0;
  if(S.prevEstado==='cargando') setTimeout(()=>{ if(S.open===v && S.prevEstado==='cargando'){ S.prevEstado='ok'; renderLectura(); } },650);
  if(S.prevEstado==='eliminada'){ S.eliminadas.add(v); renderAll(); marcarAbierta(); }
  $('#live').textContent = VAC[v]?`Vista previa: ${VAC[v].t} · ${VAC[v].sede}`:'Esta vacante ya no existe';
  if(m!=='lado') $('#shTitle').focus({preventScroll:true});
  else if(!desdeLista){ const b=verDe(v); if(b) b.focus({preventScroll:true}); else $('#shTitle').focus({preventScroll:true}); }
}
function cerrar(viaTeclado){
  if(!S.open) return;
  const was=S.open, m=modo();
  if(viaTeclado && m!=='lado'){ document.body.classList.add('instant'); requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('instant'))); }
  document.body.classList.remove('reading');
  S.open=null; S.copy=null; writeURL(); aplicarModal(); marcarAbierta(); renderBusqueda();
  const b=verDe(was);
  if(b) b.focus({preventScroll:m!=='lado'}); else if(lastFocus&&document.contains(lastFocus)) lastFocus.focus({preventScroll:true}); else $('#q').focus({preventScroll:true});
}
function step(d){
  const list=visible(); const i=list.findIndex(r=>r.v===S.open); const n=list[i+d]; if(!n) return;
  abrir(n.v,true,true); $('#shTitle').focus({preventScroll:true});
}
function renderLectura(){
  const m=modo(), list=visible(), i=list.findIndex(x=>x.v===S.open);
  const cerrarBtn = m==='lado'
    ? `<button class="btn ghost" id="shBack" type="button">${icon.x}Cerrar<kbd class="kbd-esc" aria-hidden="true">Esc</kbd></button>`
    : `<button class="btn ghost" id="shBack" type="button">${icon.down}Volver<kbd class="kbd-esc" aria-hidden="true">Esc</kbd></button>`;
  $('#shHead').innerHTML=`<div class="handle" aria-hidden="true"></div><div class="sh-bar">${cerrarBtn}<div class="pager"><button class="icon-btn" id="shPrev" type="button" aria-label="Anterior" ${i<=0?'disabled':''}>${icon.left}</button><span class="num">${i>=0?i+1:'–'} / ${list.length}</span><button class="icon-btn" id="shNext" type="button" aria-label="Siguiente" ${i<0||i>=list.length-1?'disabled':''}>${icon.right}</button></div></div>`;
  const r=current(), v=VAC[S.open];
  if(!r||S.prevEstado==='eliminada'){
    $('#shBody').innerHTML=`<div class="marco" style="margin-top:var(--e5)"><h2 class="tituloVacio sh-title" id="shTitle" tabindex="-1" style="font-size:var(--t-entradilla)">Esta vacante ya no existe</h2><div class="botones"><button class="btn" type="button" id="shBack2">Volver a la lista</button></div></div>`;
    return;
  }
  const draftOnly=r.estado==='BORRADOR', canCopy=S.puedeEditar&&!draftOnly&&S.prevEstado==='ok';
  let html=`<p class="eyebrow"><span class="datos"><span class="dato">${TIPOS[S.tipo]}</span><span class="dato">${v.nivel||'—'}</span><span class="dato">Situación: ${v.sit}</span></span></p>
    <h2 class="sh-title" id="shTitle" tabindex="-1">${esc(v.t)} <span class="sede">${esc(v.sede)}</span></h2>
    <div class="sh-sub"><span class="chips">${chipsDe(r)}</span>${r.borrador?'<span class="chip open">Hay un borrador abierto</span>':''}<span>${resumen(r,S.tipo)}</span><span>${r.pub?'Versión del '+fecha(r.pub):'Sin publicar'}</span></div>
    <div class="sh-actions"><a class="btn" id="shOpen" href="#/admin/vacantes/${r.v.slice(1)}/${rutaDe()}">${icon.out}Abrir en la vacante</a>${canCopy?`<button class="btn primary" type="button" id="shCopy" aria-expanded="${!!S.copy}" aria-controls="copy">${icon.copy}Usar en otra vacante</button>`:''}</div>
    ${canCopy?`<div class="copy${S.copy?' open':''}" id="copy"><div><div class="copy-in" id="copyIn"></div></div></div>`:''}`;
  if(S.prevEstado==='cargando'){
    html+=`<div class="lectura-carga" aria-busy="true"><p style="display:flex;gap:8px;align-items:center;font-size:var(--t-apoyo);color:var(--tinta2);margin-bottom:var(--e3)"><span class="spin" aria-hidden="true"></span>Cargando la vista previa…</p><div class="barra-c barraLarga"></div><div class="barra-c barraCorta"></div><div class="barra-c barraLarga"></div></div>`;
  } else if(S.prevEstado==='error'){
    html+=`<div class="aviso malo" role="alert"><span>No se pudo cargar la vista previa.</span><button class="btn" type="button" id="prevRetry">Reintentar</button></div>`;
  } else {
    let off=0;
    const crits=r.crit.map((c,ci)=>{
      const lis=c.p.map((q,j)=>{ const ent=(r.ent||[]).find(e=>e.de==='Pregunta '+(off+j+1)); return `<li>${esc(qText(q))}${ent?`<span class="chip att" title="${esc(ent.n)}">${icon.clip}Entrega un archivo</span>`:''}</li>`; }).join('');
      const h=`<section class="crit"><h4><span class="num">${String(ci+1).padStart(2,'0')}</span>${esc(c.n)}</h4>${c.p.length?`<ol style="counter-reset:q ${off}">${lis}</ol>`:'<p class="none">Sin preguntas</p>'}</section>`;
      off+=c.p.length; return h;
    }).join('');
    html+=`${draftOnly?'<p class="draft-note">Borrador: todavía puede cambiar</p>':''}
      ${S.tipo==='prueba'?`<section class="blk"><h3>Caso</h3><p class="caso">${r.caso?esc(r.caso):'Sin caso'}</p></section>`:''}
      <section class="blk"><h3>Criterios y preguntas</h3><div class="crits">${crits}</div></section>
      ${S.tipo==='prueba'?`<section class="blk"><h3>Entregables · ${r.ent.length}</h3>${r.ent.length?`<ul class="ent">${r.ent.map(e=>`<li><span>${esc(e.n)}</span><span class="fmt">${esc(e.f)} · ${esc(e.de)}</span></li>`).join('')}</ul>`:'<p class="caso">Sin entregables</p>'}</section>`:''}`;
  }
  $('#shBody').innerHTML=html;
  if(canCopy) renderCopy();
}

/* ============ Copia en línea ============ */
function destOff(d){ return d.off || (S.copy && S.copy.ya.has(d.v)); }
function destRows(){
  const q=norm(S.copy?.q||'');
  return DESTINOS[S.tipo].filter(d=>d.v!==S.open).filter(d=>!q||norm(VAC[d.v].t).includes(q)).sort((a,b)=>(destOff(a)?1:0)-(destOff(b)?1:0));
}
function renderCopy(){
  const box=$('#copyIn'); if(!box) return;
  const c=S.copy;
  if(!c){ box.innerHTML=''; return; }
  if(!box.querySelector('#destQ')){
    box.innerHTML=`<div class="copy-head"><label for="destQ">Vacante destino</label><button class="btn ghost" type="button" id="copyCancel">Cancelar</button></div>
      <input type="search" id="destQ" placeholder="Buscar vacante…" autocomplete="off">
      <div class="dests" id="dests" role="radiogroup" aria-label="Vacante destino"></div>
      <div class="copy-act" id="copyAct" aria-live="polite"></div>`;
  }
  const list=$('#dests');
  if(c.loading){ list.innerHTML=`<p style="display:flex;gap:8px;align-items:center;min-height:44px;font-size:var(--t-apoyo);color:var(--tinta2)"><span class="spin" aria-hidden="true"></span>Cargando vacantes…</p>`; $('#copyAct').innerHTML=''; return; }
  const rows=destRows();
  list.innerHTML = rows.length ? rows.map(d=>{
    const v=VAC[d.v], on=c.sel===d.v, off=destOff(d);
    return `<label class="dest${on?' on':''}${off?' off':''}"><input type="radio" name="dest" value="${d.v}" ${on?'checked':''} ${off||c.status==='copying'?'disabled':''}><span class="dt">${esc(v.t)} <span class="sede">· ${esc(v.sede)}</span></span><span class="dm">Situación: ${v.sit}${d.bor?' · Tiene un borrador':''}</span>${off?`<span class="why">${MOTIVO[S.tipo]}</span>`:''}</label>`; }).join('')
    : `<p style="min-height:44px;display:flex;align-items:center;font-size:var(--t-apoyo);color:var(--tinta2)">Ninguna vacante coincide.</p>`;
  let h='';
  const go=(t)=>`<button class="btn primary" type="button" id="copyGo" ${!c.sel||c.status==='copying'?'disabled':''}><span class="lbl${c.status==='copying'?' blur':''}">${c.status==='copying'?'<span class="spin" aria-hidden="true"></span>Copiando…':t}</span></button>`;
  if(c.status==='error') h=`<span class="msg bad" role="alert">No se pudo copiar. La vacante destino no cambió.</span><span class="btns"><button class="btn" type="button" id="copyRetry">Reintentar</button></span>`;
  else if(c.status==='rechazo') h=`<span class="msg bad" role="alert">${c.msg}</span><span class="btns">${go('Copiar y abrir')}</span>`;
  else if(c.confirm) h=`<span class="msg warn">Ya hay un borrador en esta vacante: la copia lo reemplaza entero.</span><span class="btns"><button class="btn" type="button" id="copyBack">Elegir otra</button>${go('Reemplazar y copiar')}</span>`;
  else h=`<span class="msg"></span><span class="btns">${go('Copiar y abrir')}</span>`;
  $('#copyAct').innerHTML=h;
}
function openCopy(){
  if(S.copy){ closeCopy(); return; }
  S.copy={q:'',sel:null,status:'idle',confirm:false,loading:true,ya:new Set()};
  $('#copy').classList.add('open'); $('#shCopy').setAttribute('aria-expanded','true');
  renderCopy(); $('#destQ').focus({preventScroll:true});
  setTimeout(()=>{ if(S.copy){ S.copy.loading=false; renderCopy(); } },350);
}
function closeCopy(){
  if(!S.copy) return; S.copy=null;
  const el=$('#copy'); if(el) el.classList.remove('open');
  const b=$('#shCopy'); if(b){ b.setAttribute('aria-expanded','false'); b.focus(); }
  setTimeout(()=>{ if(!S.copy) renderCopy(); },220);
}
function doCopy(){
  const c=S.copy; if(!c||!c.sel||c.status==='copying') return;
  const d=DESTINOS[S.tipo].find(x=>x.v===c.sel);
  if(d.bor && !c.confirm){ c.confirm=true; c.status='idle'; renderCopy(); $('#copyGo')?.focus(); return; }
  c.status='copying'; renderCopy();
  setTimeout(()=>{
    if(S.copy!==c) return;
    if(S.copiaFalla){ c.status='error'; renderCopy(); $('#copyRetry')?.focus(); return; }
    if(S.carrera && !c.ya.has(c.sel)){
      c.ya.add(c.sel); c.sel=null; c.confirm=false; c.status='rechazo';
      c.msg = S.tipo==='preguntas'?'Esta vacante ya tiene postulantes: sus preguntas ya no se pueden reemplazar.':'Alguien ya empezó a rendir esta prueba: ya no se puede reemplazar.';
      renderCopy(); $('#destQ')?.focus(); return;
    }
    const name=`${VAC[c.sel].t} · ${VAC[c.sel].sede}`;
    cerrar(false);
    toast(`Demo: aquí se abre el editor de «${name}» con el borrador copiado`);
  },900);
}

/* ============ Aviso flotante ============ */
let toastTimer=null;
function toast(msg){
  const box=$('#toasts'); box.innerHTML='';
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; box.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),220); },4200);
}

/* ============ Teclado de la lista: la paleta ============ */
const q=$('#q');
const items=()=>$$('#sugs .sug, #results .ver');
function enfocar(el){
  el.focus();
  if(S.open && modo()==='lado' && el.classList.contains('ver') && el.dataset.ver!==S.open) abrir(el.dataset.ver,true,true);
}
q.addEventListener('input',()=>{ S.q=q.value; S.armed=false; renderBusqueda(); renderResults(); writeURL(); });
q.addEventListener('keydown',e=>{
  const rows=$$('#results .ver'), sugs=$$('#sugs .sug');
  if(e.key==='ArrowDown'){ e.preventDefault(); const t=rows[0]||sugs[0]; if(t) enfocar(t); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(sugs.length) enfocar(sugs[sugs.length-1]); }
  else if(e.key==='Enter'){ e.preventDefault(); if(rows[0]) abrir(rows[0].dataset.ver,true); else if(sugs[0]){ const [k,v]=sugs[0].dataset.sug.split('|'); aplicarSug(k,v); } }
  else if(e.key==='Backspace' && !q.value){
    const u=tokenUnits(); if(!u.length) return;
    if(S.armed){ const last=u[u.length-1]; S.f[last.k]=S.f[last.k].filter(x=>!last.vals.includes(x)); S.armed=false; renderAll(); } else { S.armed=true; renderBusqueda(); }
  }
  else if(e.key==='Escape'){ if(q.value){ e.stopPropagation(); q.value=''; S.q=''; renderAll(); } else if(S.armed){ e.stopPropagation(); S.armed=false; renderBusqueda(); } }
  else if(S.armed){ S.armed=false; renderBusqueda(); }
});
$('#listaCol').addEventListener('keydown',e=>{
  const t=e.target; if(!t.matches('.ver,.sug')) return;
  const it=items(), i=it.indexOf(t);
  if(e.key==='ArrowDown'){ e.preventDefault(); if(it[i+1]) enfocar(it[i+1]); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(i>0) enfocar(it[i-1]); else q.focus(); }
  else if(e.key==='Home'){ e.preventDefault(); enfocar(it[0]); }
  else if(e.key==='End'){ e.preventDefault(); enfocar(it[it.length-1]); }
  else if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key!==' '){ q.focus(); }
});
$('#line').addEventListener('click',e=>{ if(!e.target.closest('button')) q.focus(); });
$('#toks').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(!b) return; const [k,...vals]=b.dataset.rm.split('|'); S.f[k]=S.f[k].filter(x=>!vals.includes(x)); S.armed=false; renderAll(); q.focus(); });
$('#quitar').addEventListener('click',()=>{ quitarFiltros(); q.focus(); });
$('#sugs').addEventListener('click',e=>{ const b=e.target.closest('[data-sug]'); if(!b) return; const [k,v]=b.dataset.sug.split('|'); aplicarSug(k,v); });
$('#results').addEventListener('click',e=>{
  const a=e.target.closest('[data-abrir]'); if(a){ e.preventDefault(); const v=VAC[a.dataset.abrir]; toast(`Demo: aquí se abre el editor de «${v.t} · ${v.sede}»`); return; }

$('#banner').addEventListener('click',e=>{ if(e.target.closest('#retry')) reintentar(); });
function reintentar(){ S.reintentando=true; renderResults(); setTimeout(()=>{ S.reintentando=false; S.demo='normal'; syncDemo(); renderAll(); },900); }

/* Pestañas */
$('#tabs').addEventListener('click',e=>{ const t=e.target.closest('[data-tipo]'); if(t) setTipo(t.dataset.tipo); });
$('#tabs').addEventListener('keydown',e=>{

/* Lectura: clics */
$('#scrim').addEventListener('click',()=>cerrar(false));
$('#lectura').addEventListener('click',e=>{

$('#lectura').addEventListener('input',e=>{ if(e.target.id==='destQ'){ S.copy.q=e.target.value; renderCopy(); } });

/* Teclado global: Esc siempre cierra lo de arriba; foco atrapado si la lectura es modal */
document.addEventListener('keydown',e=>{
  if(cajonVivo) return;
  if(e.key==='Escape'){
    if(pop.classList.contains('open')){ e.preventDefault(); setPop(false,true); $('#fbtn').focus(); return; }
    if(S.copy){ e.preventDefault(); closeCopy(); return; }
    if(S.open){ e.preventDefault(); cerrar(true); return; }
    return;
  }
  const modal=S.open && modo()!=='lado';
  if(modal && e.key==='Tab'){
    const f=[...$('#lectura').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),[tabindex="0"]')].filter(x=>x.offsetParent!==null);
    if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(!$('#lectura').contains(document.activeElement)){ e.preventDefault(); a.focus(); return; }
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
    return;
  }
  const typing=e.target.matches('input,textarea');
  if(modal && !typing && (e.key==='ArrowRight'||e.key==='ArrowLeft') && !e.altKey && !e.metaKey){ e.preventDefault(); step(e.key==='ArrowRight'?1:-1); return; }
  if(!modal && ((e.key==='/'&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){ e.preventDefault(); q.focus(); q.select(); }
});

/* Gestos de la hoja (no en el panel lateral): abajo cierra, de lado cambia */
(function(){
  const sheet=$('#lectura'), head=$('#shHead'); let st=null;
  head.addEventListener('pointerdown',e=>{
    if(modo()==='lado'||e.target.closest('button,a,input,label')) return;
    st={x:e.clientX,y:e.clientY,t:performance.now(),dx:0,dy:0,axis:null,id:e.pointerId}; head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id) return;
    st.dx=e.clientX-st.x; st.dy=e.clientY-st.y;
    if(!st.axis && Math.hypot(st.dx,st.dy)>6) st.axis=Math.abs(st.dy)>=Math.abs(st.dx)?'y':'x';
    if(!st.axis) return;
    sheet.classList.add('dragging');
    sheet.style.transform = st.axis==='y' ? `translateY(${st.dy<0?st.dy/5:st.dy}px)` : `translateX(${st.dx*0.4}px)`;
  });
  const end=e=>{
    if(!st||e.pointerId!==st.id) return;
    const dt=Math.max(1,performance.now()-st.t), {axis,dx,dy}=st; st=null;
    sheet.classList.remove('dragging'); sheet.style.transform='';
    if(axis==='y'){ if(dy>sheet.offsetHeight*0.25 || (dy/dt>0.11 && dy>20)) cerrar(false); }
    else if(axis==='x'){ if(Math.abs(dx)>80 || (Math.abs(dx)/dt>0.3 && Math.abs(dx)>30)) step(dx<0?1:-1); }
  };
  head.addEventListener('pointerup',end); head.addEventListener('pointercancel',end);
})();

/* Armazón: plegar (se recuerda en este navegador) y cajón por debajo de 1024 px */
const CLAVE_PLEGADO='renaser_panel_menu_plegado';
function aplicarPlegado(v){ document.documentElement.dataset.plegado=v?'true':'false'; $('#plegar').setAttribute('aria-pressed',v); $('#plegar .texto').textContent=v?'Desplegar menú':'Plegar menú'; }
let plegado=false; try{ plegado=localStorage.getItem(CLAVE_PLEGADO)==='true'; }catch(e){}
aplicarPlegado(plegado);
$('#plegar').addEventListener('click',()=>{ plegado=!plegado; aplicarPlegado(plegado); try{ localStorage.setItem(CLAVE_PLEGADO,String(plegado)); }catch(e){} });
let cajonVivo=null;
function abrirCajon(){
  if(cajonVivo) return;
  const frag=$('#tplCajon').content.cloneNode(true); document.body.appendChild(frag);
  cajonVivo=$('#cajon-del-menu'); $('#botonMenu').setAttribute('aria-expanded','true');
  document.body.style.overflow='hidden';
  $('#velo').addEventListener('click',cerrarCajon); $('#cerrarCajon').addEventListener('click',cerrarCajon);
  cajonVivo.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); cerrarCajon(); if(!a.getAttribute('aria-current')) toast(`Demo: aquí se abre ${a.textContent}`); }));
  cajonVivo.querySelector('a[href], button:not([disabled])').focus();
}
function cerrarCajon(){
  if(!cajonVivo) return; $('#velo').remove(); cajonVivo.remove(); cajonVivo=null;
  document.body.style.overflow=''; $('#botonMenu').setAttribute('aria-expanded','false'); $('#botonMenu').focus();
}
$('#botonMenu').addEventListener('click',abrirCajon);
document.addEventListener('keydown',e=>{
  if(!cajonVivo) return;
  if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); cerrarCajon(); return; }
  if(e.key!=='Tab') return;
  const f=[...cajonVivo.querySelectorAll('a[href], button:not([disabled])')]; const a=f[0], z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); }
},true);
try{ matchMedia('(max-width: 1023.98px)').addEventListener('change',m=>{ if(!m.matches) cerrarCajon(); }); }catch(e){}
document.querySelectorAll('#lateral a, .marcaEnlace').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); if(a.getAttribute('aria-current')) return; toast(`Demo: aquí se abre ${a.classList.contains('marcaEnlace')?'el inicio del panel':a.textContent}`); }));
$('.salir').addEventListener('click',()=>toast('Demo: aquí se cierra la sesión'));

readURL(); q.value=S.q; document.body.dataset.modo=modo(); renderAll(); aplicarModal();
