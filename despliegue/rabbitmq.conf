# La configuracion del broker que corre como contenedor en esta misma maquina.
# Se monta en /etc/rabbitmq/conf.d/ y el contenedor la lee al arrancar.

# El consumidor llama al modelo de forma sincrona y una calificacion puede pasar de la
# media hora: hay una corrida real medida de 31 minutos. Con el valor por defecto (30 min)
# el broker da el mensaje por perdido, lo reencola y el mismo trabajo se paga otra vez al
# proveedor del modelo. 60 min da margen; el corte real lo ponen el read-timeout de la
# aplicacion y el x-delivery-limit de las colas. Es el mismo valor que el compose de
# desarrollo pasa por RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS.
consumer_timeout = 3600000

# Sin esto el broker se cree dueno del 40% de los 4 GB de la maquina y compite con la JVM.
# El techo real de proceso lo pone el mem_limit del compose (768m); este umbral, mas bajo,
# hace que RabbitMQ frene a los publicadores antes de acercarse a ese limite, en vez de
# morir contra el por un OOM del kernel.
vm_memory_high_watermark.absolute = 512MB
