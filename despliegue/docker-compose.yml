# Lo que corre en el servidor de AWS.
#
# Son tres contenedores: la aplicacion, Caddy y la cola. Lo pesado sigue fuera —la base es
# Supabase y los curriculums viven en su bucket— asi que esta maquina se puede tirar y
# volver a crear sin perder nada que importe: los certificados los saca Caddy otra vez
# solo, y los mensajes que hubiera en la cola los reencola la propia aplicacion, que apunta
# los trabajos en la tabla trabajo_ia antes de avisar por el broker y tiene un sondeo que
# rescata lo pendiente cada cinco minutos.
#
# Se levanta con:
#   docker compose --env-file .env up -d
#
# Las credenciales NO estan aqui: vienen de .env, que no se versiona. Ver .env.example.

services:

  # ---------------------------------------------------------------- la aplicacion
  aplicacion:
    image: ${IMAGEN}
    container_name: renaser-backend
    restart: always
    # La cola primero, y sana: sin esto la aplicacion arranca contra un broker que aun
    # esta levantando y quema sus reintentos de conexion antes de tiempo.
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: pruebas

      # Base de datos: Supabase. Puerto 5432 (la conexion directa), NO el 6543 del pooler
      # de transacciones, que no soporta las consultas preparadas que Flyway necesita para
      # migrar y hace fallar el arranque con un error que no dice por que.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # La cola es el contenedor rabbitmq de aqui abajo. El HOST llega del .env y vale
      # «rabbitmq», el nombre del servicio: lo resuelve la red interna del compose. El
      # puerto y el TLS no van aqui — application-pruebas.yaml ya trae los valores buenos
      # (5672 en claro); solo harian falta para volver a un broker gestionado.
      #
      # Dos cosas que rompen el arranque si se copian mal:
      #   - el HOST va sin esquema y sin puerto. Spring arma la url el solo; pegar un
      #     endpoint entero da un fallo de resolucion de nombre que no menciona el esquema
      #   - estos nombres NO llevan el prefijo SPRING_: application-pruebas.yaml hace
      #     `host: ${RABBITMQ_HOST}` sin valor por defecto, asi que como SPRING_RABBITMQ_*
      #     el marcador se queda sin resolver y la aplicacion no arranca — con un error
      #     que habla de un placeholder, no de la cola.
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # Cuantos candidatos se califican a la vez.
      #
      # application-pruebas.yaml los deja en 2/4, que es lo prudente mientras el panel hace
      # consultas caras: los consumidores compiten por las mismas conexiones que el portal.
      # Con el N+1 de la bandeja arreglado eso deja de ser cierto, y a 2/4 la criba va a un
      # quinto de su ritmo — medido: 3,9 trabajos por minuto contra 19,8.
      #
      # Va por variable y no en el yaml para poder subirlo o bajarlo sin reconstruir la
      # imagen, que es justo lo que hace falta cuando hay una tanda esperando.
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: ${IA_CONSUMIDORES:-8}
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: ${IA_CONSUMIDORES_MAX:-12}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      JWT_SECRETO: ${JWT_SECRETO}

      # La puerta del equipo, encendida A PROPOSITO y a la vista.
      #
      # Desde el 22/08/2026 el codigo la trae APAGADA por defecto, para que un entorno nuevo
      # nazca cerrado. Aqui hay que volver a encenderla porque hoy dev-login es la UNICA
      # forma de entrar al panel: seleccionApi.js:194 es el unico sitio donde el frontend
      # pide un token, PanelAuthController no expone ninguna otra ruta, y cinco scripts
      # (cargar-convocatoria, invitar, lista-para-rrhh, exportar-para-demo y
      # sembrar-datos-de-prueba) entran por ahi. Apagarla sin sustituta deja al equipo fuera
      # de su propio panel.
      #
      # ⚠️ Esto NO cierra el agujero, lo hace explicito: quien tenga la direccion puede
      # sacar un token con TALENTO, DIRECCION y ADMINISTRADOR. Se pone en false el dia que
      # RENASER OS emita la identidad del equipo — es la tarea T2 de
      # docs/SUBSANACION-SPRINT-1.md, y hasta entonces sigue abierta a sabiendas.
      APP_SEGURIDAD_DEV_LOGIN_ACTIVO: ${DEV_LOGIN_ACTIVO:-true}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # La clave del bucket donde viven los curriculums. Sin esto la aplicacion arranca
      # igual y falla al abrir el primer CV, que es peor que no arrancar: se descubre
      # tarde y con un candidato delante.
      APP_ARCHIVOS_TIPO: supabase
      APP_ARCHIVOS_SUPABASE_CLAVE: ${APP_ARCHIVOS_SUPABASE_CLAVE}

      # Correo. Sin CORREO_TRANSPORTE=smtp la aplicacion arranca igual y solo anota los
      # avisos en correo_enviado, que es el comportamiento por defecto y no rompe nada.
      CORREO_TRANSPORTE: ${CORREO_TRANSPORTE:-log}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Sin esto el envio falla contra cualquier proveedor serio en el 587. Gmail contesta
      # «530-5.7.0 Must issue a STARTTLS command first», que no nombra ni el TLS ni la
      # propiedad que falta. Van tambien en application.yaml; aqui estan para poder
      # arreglarlo sin reconstruir la imagen.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}

      # Sin esto los correos saldrian con enlaces a localhost:5174.
      PORTAL_URL: ${PORTAL_URL}

      # El Dockerfile pide el 75% de la memoria del contenedor. En una maquina de 2 GB eso
      # deja al sistema sin aire; el limite de abajo es lo que hace que ese 75% sea de 1,5 GB
      # y no de toda la maquina.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    mem_limit: ${MEMORIA_APP:-2g}
    # Solo escucha en la red interna: quien habla con el mundo es Caddy.
    expose:
      - "8080"
    # En loopback ademas, y solo ahi: es por donde pregunta el chequeo de desplegar.sh.
    ports:
      - "127.0.0.1:8080:8080"
    logging: &registro
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- la cola
  #
  # RabbitMQ como un contenedor mas, y no Amazon MQ: el broker gestionado costaba ~119
  # dolares al mes —mas que todo el resto de la infraestructura junta— por hacer lo que
  # este proceso hace gratis. La durabilidad no descansa en el: cada trabajo se guarda en
  # trabajo_ia antes de publicarse, y el sondeo de la aplicacion reencola lo que se pierda.
  #
  # La imagen es 4.2 sin «-management»: misma version que corria en Amazon MQ, y el panel
  # web no pinta nada en produccion. Sin bloque ports a proposito — solo la red interna
  # del compose habla con el; desde fuera de la maquina este broker no existe.
  rabbitmq:
    image: rabbitmq:4.2-alpine
    container_name: renaser-rabbitmq
    restart: always
    environment:
      # Las MISMAS variables que lee la aplicacion mas arriba: el usuario se crea al
      # inicializarse el volumen y los dos lados no se pueden desincronizar. Ojo: solo la
      # PRIMERA vez — si algun dia se cambia la contrasena en Parameter Store, al broker
      # hay que cambiarsela por dentro (rabbitmqctl change_password), no le llega sola.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_datos:/var/lib/rabbitmq
      # El consumer_timeout de 60 min y el techo de memoria. Ver los porques en el archivo.
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-renaser.conf:ro
    # Techo de proceso. Con la aplicacion en 2g y esto en 768m, a la maquina de 4 GB le
    # queda cerca de un giga para Caddy y el sistema, con el swap de reserva.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Levantar de cero tarda mas que un ping: sin este margen el primer arranque puede
      # marcarse unhealthy antes de terminar y tirar el depends_on de la aplicacion.
      start_period: 30s
    logging: *registro

  # ---------------------------------------------------------------- la puerta
  #
  # Caddy y no un balanceador: un ALB son 16 dolares al mes para repartir trafico entre UNA
  # maquina. Caddy saca y renueva el certificado de Let's Encrypt solo, sin cron ni
  # recordatorios.
  caddy:
    image: caddy:2-alpine
    container_name: renaser-caddy
    restart: always
    # Sin «talento» a proposito: Compose rechaza que un servicio dependa de otro que
    # esta en un perfil apagado. Si talento no corre, Caddy devuelve 502 en sus rutas y
    # el resto del sitio sigue en pie, que es el comportamiento que se quiere.
    depends_on:
      - aplicacion
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    environment:
      # Si no hay dominio se pasa «:80» y Caddy sirve por HTTP contra la IP. El valor por
      # defecto va AQUI y no en el Caddyfile porque el de Caddy solo aplica si la variable
      # no existe, y esta existe: llega vacia desde el .env. Con la cadena vacia la primera
      # linea del Caddyfile queda como « {», que Caddy lee como un bloque de opciones
      # globales y falla con «unrecognized global option: encode».
      DOMINIO: ${DOMINIO:-:80}
    logging: *registro

volumes:
  caddy_datos:
  caddy_config:
  # Colas y mensajes del broker. Perderlo no pierde trabajo: la verdad vive en trabajo_ia
  # y el sondeo de la aplicacion reencola lo pendiente en el siguiente ciclo.
  rabbitmq_datos:
