# Lo que corre en el servidor de AWS.
#
# Son tres contenedores y ninguno guarda nada: la base es Supabase, los curriculums viven en
# su bucket y la cola es Amazon MQ. Esta maquina se puede tirar y volver a crear sin perder
# nada mas que los certificados, que Caddy vuelve a sacar solo.
#
# El tercero es «talento» y se sumo el 24/08/2026: hasta entonces el modulo de Capacidad,
# Desempeno y Human Gate estaba escrito y probado pero no corria en ningun entorno, asi que
# la mitad del checklist del Sprint 1 no se podia verificar «llamando directo a la API».
#
# Se levanta con:
#   docker compose --env-file .env up -d
#
# Las credenciales NO estan aqui: vienen de .env, que no se versiona. Ver .env.example.

services:

  # ---------------------------------------------------------------- la aplicacion
  aplicacion:
    image: ${IMAGEN}
    container_name: renaser-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: pruebas

      # Base de datos: Supabase. Puerto 5432 (la conexion directa), NO el 6543 del pooler
      # de transacciones, que no soporta las consultas preparadas que Flyway necesita para
      # migrar y hace fallar el arranque con un error que no dice por que.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # La cola es Amazon MQ (broker renaser-mq, RabbitMQ 4.2, us-east-1).
      #
      # Tres cosas que no son como en local y rompen el arranque si se copian mal:
      #   - el puerto es 5671, no 5672: Amazon MQ solo habla AMQPS, cifrado
      #   - por lo mismo, ssl.enabled tiene que ir en true
      #   - el HOST va sin «amqps://» y sin puerto. Spring arma la url el solo; pegar el
      #     endpoint entero da un fallo de resolucion de nombre que no menciona el esquema
      # Los nombres son los que espera application-pruebas.yaml, y NO llevan el prefijo
      # SPRING_: ese archivo hace `host: ${RABBITMQ_HOST}` sin valor por defecto, asi que si
      # se ponen como SPRING_RABBITMQ_* el marcador se queda sin resolver y la aplicacion no
      # arranca — con un error que habla de un placeholder, no de la cola.
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: 5671
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # Cuantos candidatos se califican a la vez.
      #
      # application-pruebas.yaml los deja en 2/4, que es lo prudente mientras el panel hace
      # consultas caras: los consumidores compiten por las mismas conexiones que el portal.
      # Con el N+1 de la bandeja arreglado eso deja de ser cierto, y a 2/4 la criba va a un
      # quinto de su ritmo — medido: 3,9 trabajos por minuto contra 19,8.
      #
      # Va por variable y no en el yaml para poder subirlo o bajarlo sin reconstruir la
      # imagen, que es justo lo que hace falta cuando hay una tanda esperando.
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: ${IA_CONSUMIDORES:-8}
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: ${IA_CONSUMIDORES_MAX:-12}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      JWT_SECRETO: ${JWT_SECRETO}

      # La puerta del equipo, encendida A PROPOSITO y a la vista.
      #
      # Desde el 22/08/2026 el codigo la trae APAGADA por defecto, para que un entorno nuevo
      # nazca cerrado. Aqui hay que volver a encenderla porque hoy dev-login es la UNICA
      # forma de entrar al panel: seleccionApi.js:194 es el unico sitio donde el frontend
      # pide un token, PanelAuthController no expone ninguna otra ruta, y cinco scripts
      # (cargar-convocatoria, invitar, lista-para-rrhh, exportar-para-demo y
      # sembrar-datos-de-prueba) entran por ahi. Apagarla sin sustituta deja al equipo fuera
      # de su propio panel.
      #
      # ⚠️ Esto NO cierra el agujero, lo hace explicito: quien tenga la direccion puede
      # sacar un token con TALENTO, DIRECCION y ADMINISTRADOR. Se pone en false el dia que
      # RENASER OS emita la identidad del equipo — es la tarea T2 de
      # docs/SUBSANACION-SPRINT-1.md, y hasta entonces sigue abierta a sabiendas.
      APP_SEGURIDAD_DEV_LOGIN_ACTIVO: ${DEV_LOGIN_ACTIVO:-true}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # La clave del bucket donde viven los curriculums. Sin esto la aplicacion arranca
      # igual y falla al abrir el primer CV, que es peor que no arrancar: se descubre
      # tarde y con un candidato delante.
      APP_ARCHIVOS_TIPO: supabase
      APP_ARCHIVOS_SUPABASE_CLAVE: ${APP_ARCHIVOS_SUPABASE_CLAVE}

      # Correo. Sin CORREO_TRANSPORTE=smtp la aplicacion arranca igual y solo anota los
      # avisos en correo_enviado, que es el comportamiento por defecto y no rompe nada.
      CORREO_TRANSPORTE: ${CORREO_TRANSPORTE:-log}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Sin esto el envio falla contra cualquier proveedor serio en el 587. Gmail contesta
      # «530-5.7.0 Must issue a STARTTLS command first», que no nombra ni el TLS ni la
      # propiedad que falta. Van tambien en application.yaml; aqui estan para poder
      # arreglarlo sin reconstruir la imagen.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}

      # Sin esto los correos saldrian con enlaces a localhost:5174.
      PORTAL_URL: ${PORTAL_URL}

      # El Dockerfile pide el 75% de la memoria del contenedor. En una maquina de 2 GB eso
      # deja al sistema sin aire; el limite de abajo es lo que hace que ese 75% sea de 1,5 GB
      # y no de toda la maquina.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    mem_limit: ${MEMORIA_APP:-2g}
    # Solo escucha en la red interna: quien habla con el mundo es Caddy.
    expose:
      - "8080"
    # En loopback ademas, y solo ahi: es por donde pregunta el chequeo de desplegar.sh.
    ports:
      - "127.0.0.1:8080:8080"
    logging: &registro
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- talento
  #
  # El modulo de Capacidad, Desempeno y Human Gate (repositorio renaser-os-talent-backend).
  #
  # POR QUE AQUI Y NO EN RENDER. Su render.yaml existe pero apunta al plan gratuito, que
  # suspende la instancia a los 15 minutos sin trafico y tarda cerca de un minuto en
  # despertar; y el motor ya se mudo de Render a AWS en agosto, asi que mantenerlo alli
  # serian dos proveedores para dos mitades del mismo producto. Esta maquina ya esta pagada
  # y ya tiene HTTPS.
  #
  # LA MEMORIA ES EL LIMITE REAL, no el CPU. La maquina es una t3.medium: 4 GB, mas los 2 GB
  # de swap que crea user-data.sh. El motor toma hasta 2 GB, este 1 GB, Caddy unos 50 MB, y
  # el resto es para el sistema y Docker. Sale justo y por eso el techo va escrito: sin
  # mem_limit, la primera tanda de calificacion con IA se come la maquina y el contenedor de
  # talento desaparece sin dejar nada en su propio log.
  #
  # 1 GB alcanza porque este modulo no llama a ningun modelo ni consume de la cola: son
  # consultas, reglas y formulas. Sus 133 pruebas corren en menos de un minuto.
  talento:
    # DETRAS DE UN PERFIL, y esto no es un detalle de estilo.
    #
    # Sin el, añadir este servicio rompe el despliegue del motor: `docker compose up -d`
    # intentaria levantarlo, IMAGEN_TALENTO estaria vacia en el .env que ya existe en la
    # maquina, y el arranque fallaria entero — llevandose por delante un backend que
    # funcionaba. Con el perfil, lo de hoy sigue igual hasta que alguien lo encienda.
    #
    # Se enciende poniendo COMPOSE_PROFILES=talento en el .env del servidor.
    profiles:
      - talento
    image: ${IMAGEN_TALENTO}
    container_name: renaser-talento
    restart: always
    environment:
      # La misma base que el motor, la cadena DIRECTA de Supabase (5432, no el pooler).
      # Nombres distintos a los del motor porque este modulo los lee con su propio prefijo.
      RENASER_DB_URL: ${SPRING_DATASOURCE_URL}
      RENASER_DB_USER: ${SPRING_DATASOURCE_USERNAME}
      RENASER_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Cinco conexiones de las treinta del proyecto. El motor ya reserva doce y las
      # personas necesitan las suyas: psql, el panel de Supabase, la rama de otro.
      RENASER_DB_POOL_MAX: ${RENASER_DB_POOL_MAX:-5}

      # ⚠️ La identidad la emite Supabase Auth, no este backend. Sin el JWKS el modulo
      # arranca DENEGANDO todo Talento —falla cerrado, no abierto—, asi que un despliegue
      # sin esta variable levanta un servicio que responde 401 a todo y parece roto.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${TALENTO_JWKS_URI}
      RENASER_JWT_ISSUER: ${TALENTO_JWT_ISSUER}
      RENASER_JWT_AUDIENCE: ${TALENTO_JWT_AUDIENCE:-authenticated}

      RENASER_ORG_CODIGO: ${RENASER_ORG_CODIGO:-RENASER}
      # Nunca «*»: son los origenes del panel que puede llamarle.
      RENASER_WEB_ORIGENES_PERMITIDOS: ${TALENTO_ORIGENES}

      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    mem_limit: ${MEMORIA_TALENTO:-1g}
    # Solo red interna: quien habla con el mundo es Caddy. No se publica en loopback
    # porque el chequeo de desplegar.sh pregunta por el motor, no por este.
    expose:
      - "8080"
    logging: *registro

  # ---------------------------------------------------------------- la puerta
  #
  # Caddy y no un balanceador: un ALB son 16 dolares al mes para repartir trafico entre UNA
  # maquina. Caddy saca y renueva el certificado de Let's Encrypt solo, sin cron ni
  # recordatorios.
  caddy:
    image: caddy:2-alpine
    container_name: renaser-caddy
    restart: always
    # Sin «talento» a proposito: Compose rechaza que un servicio dependa de otro que
    # esta en un perfil apagado. Si talento no corre, Caddy devuelve 502 en sus rutas y
    # el resto del sitio sigue en pie, que es el comportamiento que se quiere.
    depends_on:
      - aplicacion
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    environment:
      # Si no hay dominio se pasa «:80» y Caddy sirve por HTTP contra la IP. El valor por
      # defecto va AQUI y no en el Caddyfile porque el de Caddy solo aplica si la variable
      # no existe, y esta existe: llega vacia desde el .env. Con la cadena vacia la primera
      # linea del Caddyfile queda como « {», que Caddy lee como un bloque de opciones
      # globales y falla con «unrecognized global option: encode».
      DOMINIO: ${DOMINIO:-:80}
    logging: *registro

volumes:
  caddy_datos:
  caddy_config:
